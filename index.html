<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UML Drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: question pane | toolbox + graph-paper canvas | inspector/results. Engineering-paper grid, pen-ink boxes, marker-blue selection. */
:root {
  --paper: #f3f6f5;
  --panel: #ffffff;
  --sunk: #e9eeec;
  --grid: #d9e3e0;
  --ink: #17222a;
  --ink-2: #51616a;
  --rule: #ccd7d4;
  --accent: #1c5bd0;
  --accent-soft: #dde7fb;
  --on-accent: #ffffff;
  --tile-box: #e4ecfb;
  --tile-line: #e0f1ec;
  --tile-line-ink: #0f6b55;
  --err: #c2362b;
  --err-soft: #fbe5e2;
  --ok: #1f7f48;
  --ok-soft: #dff2e6;
  --note: #8a5a00;
  --note-soft: #f8edd5;
  --part: #6a46b5;
  --part-soft: #ece6f8;
  --f-display: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10161a; --panel: #172026; --sunk: #1d2830; --grid: #1f2c33; --ink: #e2eaed; --ink-2: #98a8b0; --rule: #2d3a42;
    --accent: #78a6ff; --accent-soft: #1f2f4d; --on-accent: #0d1420; --tile-box: #1e2a40; --tile-line: #16312a; --tile-line-ink: #6fd3b4;
    --err: #ff8173; --err-soft: #3a1f1c; --ok: #5fcf8f; --ok-soft: #173023; --note: #e6b455; --note-soft: #33290f;
    --part: #b9a1ff; --part-soft: #2a2140;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #10161a; --panel: #172026; --sunk: #1d2830; --grid: #1f2c33; --ink: #e2eaed; --ink-2: #98a8b0; --rule: #2d3a42;
  --accent: #78a6ff; --accent-soft: #1f2f4d; --on-accent: #0d1420; --tile-box: #1e2a40; --tile-line: #16312a; --tile-line-ink: #6fd3b4;
  --err: #ff8173; --err-soft: #3a1f1c; --ok: #5fcf8f; --ok-soft: #173023; --note: #e6b455; --note-soft: #33290f;
  --part: #b9a1ff; --part-soft: #2a2140;
  color-scheme: dark;
}

[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font: 14px/1.45 var(--f-body); }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: flex; flex-direction: column; }

/* header */
.top { display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--rule); background: var(--panel); flex-wrap: wrap; }
.brand { font: 700 19px/1 var(--f-display); letter-spacing: -0.01em; display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
.brand small { font: 600 11px/1 var(--f-mono); color: var(--ink-2); letter-spacing: 0.06em; text-transform: uppercase; }
.qtabs { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; min-width: 0; }
.qtab { border: 1px solid var(--rule); background: var(--panel); border-radius: 999px; padding: 5px 12px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; white-space: nowrap; }
.qtab[aria-selected="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.qtab .badge { font: 600 11px/1 var(--f-mono); padding: 3px 6px; border-radius: 999px; background: var(--sunk); color: var(--ink-2); }
.qtab .badge.ok { background: var(--ok-soft); color: var(--ok); }
.qtab .badge.bad { background: var(--err-soft); color: var(--err); }
.btn { border: 1px solid var(--rule); background: var(--panel); border-radius: 6px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--err); }
.btn.small { padding: 3px 9px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: default; }

/* main grid */
.layout { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(260px, 320px) minmax(0, 1fr) 300px; grid-template-rows: minmax(0, 1fr); }
.pane { min-width: 0; min-height: 0; overflow: auto; }
.qpane { border-right: 1px solid var(--rule); background: var(--panel); padding: 18px 18px 28px; }
.side { border-left: 1px solid var(--rule); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }

.qpane h1 { font: 700 22px/1.15 var(--f-display); margin: 0 0 4px; text-wrap: balance; }
.source { color: var(--ink-2); font-size: 12px; margin: 0 0 14px; }
.prompt { background: var(--accent-soft); border-radius: var(--r); padding: 10px 12px; margin: 0 0 16px; }
.prompt b { font: 600 11px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; display: block; margin-bottom: 6px; color: var(--accent); }
.codefile { margin: 0 0 12px; }
.codefile figcaption { font: 600 11px/1 var(--f-mono); color: var(--ink-2); margin-bottom: 4px; }
.codefile pre { margin: 0; background: var(--sunk); border-radius: 6px; padding: 9px 11px; overflow-x: auto; font: 12.5px/1.5 var(--f-mono); }
.kw { color: var(--accent); font-weight: 600; }
.an { color: var(--tile-line-ink); }
.cm { color: var(--ink-2); font-style: italic; }

/* workspace */
.work { display: grid; grid-template-columns: 146px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); min-width: 0; min-height: 0; }
.workmain { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.toolbox { border-right: 1px solid var(--rule); background: var(--panel); overflow: auto; padding: 12px 10px; display: flex; flex-direction: column; gap: 6px; }
.toolbox h2 { font: 600 11px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin: 8px 4px 4px; }
.toolbox h2:first-child { margin-top: 0; }
.tile { display: flex; align-items: center; gap: 8px; border: 1px solid transparent; border-radius: 8px; padding: 6px 8px; cursor: pointer; text-align: left; font-size: 13px; touch-action: none; user-select: none; }
.tile.box { background: var(--tile-box); }
.tile.line { background: var(--tile-line); }
.tile:hover { border-color: var(--ink-2); }
.tile[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.tile svg { flex: none; width: 30px; height: 20px; }
.tile svg * { vector-effect: non-scaling-stroke; }
.g-ink { stroke: var(--ink); fill: none; stroke-width: 1.4; }
.g-fill { fill: var(--panel); stroke: var(--ink); stroke-width: 1.4; }
.g-solid { fill: var(--ink); stroke: var(--ink); stroke-width: 1.4; }

.bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--rule); background: var(--panel); flex-wrap: wrap; }
.status { flex: 1; min-width: 180px; color: var(--ink-2); font-size: 13px; min-height: 2.9em; }
.status strong { color: var(--ink); }
.status.model { color: var(--note); }
.zoom { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.zoom button { border: 0; background: var(--panel); padding: 4px 9px; cursor: pointer; font: 12px var(--f-mono); }
.zoom button + button { border-left: 1px solid var(--rule); }
.zoom button:hover { background: var(--sunk); }
.codes > summary { cursor: pointer; font: 600 12px var(--f-mono); color: var(--ink-2); margin-bottom: 8px; }
.canvas-wrap { overflow: auto; min-height: 0; position: relative; }
#canvas { display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
#canvas .bg { fill: url(#gridpat); }
#canvas .gridline { stroke: var(--grid); fill: none; }
#canvas .page { fill: var(--paper); }
.node rect.box { fill: var(--panel); stroke: var(--ink); stroke-width: 1.3; }
.node line.sep { stroke: var(--ink); stroke-width: 1.1; }
.node text { fill: var(--ink); font-family: var(--f-mono); font-size: 12.5px; }
.node text.small { font-size: 11px; fill: var(--ink-2); }
.node text.ph { fill: var(--ink-2); font-style: italic; }
.node { cursor: grab; }
.node.sel rect.box { stroke: var(--accent); stroke-width: 2.4; }
.node.pending rect.box { stroke: var(--accent); stroke-dasharray: 5 3; stroke-width: 2.4; }
.node.hl rect.box { stroke: var(--err); stroke-width: 2.6; }
.node circle.box, .node polygon.box { fill: var(--panel); stroke: var(--ink); stroke-width: 1.3; }
.node .solid, .node circle.box.solid, .node rect.box.solid { fill: var(--ink); stroke: var(--ink); }
.node.sel .box { stroke: var(--accent); stroke-width: 2.4; }
.node.pending .box { stroke: var(--accent); stroke-dasharray: 5 3; stroke-width: 2.4; }
.node.hl .box { stroke: var(--err); stroke-width: 2.6; }
.node text.dtext { font-size: 11.5px; }
.codefile pre.prose { white-space: pre-wrap; font-family: var(--f-body); font-size: 13px; }
.edge .stroke { stroke: var(--ink); stroke-width: 1.4; fill: none; }
.edge .dash { stroke-dasharray: 7 5; }
.edge .deco { stroke: var(--ink); stroke-width: 1.4; fill: var(--panel); stroke-linejoin: round; }
.edge .deco.solid { fill: var(--ink); }
.edge .deco.open { fill: none; }
.edge .hit { stroke: transparent; stroke-width: 14; fill: none; cursor: pointer; }
.edge text { fill: var(--ink); font-family: var(--f-mono); font-size: 12px; paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
.edge.sel .stroke, .edge.sel .deco { stroke: var(--accent); }
.edge.sel .deco.solid { fill: var(--accent); }
.edge.hl .stroke, .edge.hl .deco { stroke: var(--err); stroke-width: 2.4; }
.readonly .node, .readonly .edge .hit { cursor: default; }
.sq-start text { fill: var(--ink-2); font: 11px var(--f-mono); }
.sq-guide { stroke: var(--rule); stroke-dasharray: 2 4; }
.sq-insert { stroke: var(--accent); stroke-dasharray: 6 4; stroke-width: 1.5; }
.sq-line { stroke: var(--ink-2); stroke-dasharray: 6 5; stroke-width: 1.2; }
.sq-band { fill: transparent; }
.sq-act { fill: var(--panel); stroke: var(--ink); stroke-width: 1.2; }
.sq-stick { fill: none; stroke: var(--ink); stroke-width: 1.4; }
.sq-x { stroke: var(--ink); stroke-width: 2; fill: none; }
.sq-dot { fill: var(--ink); }
.hit-r { fill: transparent; cursor: pointer; }
.sq-msg { cursor: grab; }
.sq-msg text.ph, .sq-frame text.ph { fill: var(--ink-2); font-style: italic; }
.sq-life.sel .sq-line { stroke: var(--accent); }
.fr-box { fill: none; stroke: var(--ink-2); stroke-width: 1.2; }
.fr-box.open { stroke: var(--err); stroke-dasharray: 4 3; }
.fr-tagbg { fill: var(--sunk); stroke: var(--ink-2); stroke-width: 1.2; }
.fr-div { stroke: var(--ink-2); stroke-dasharray: 6 4; }
.sq-frame text { fill: var(--ink); font-family: var(--f-mono); font-size: 12px; paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
.fr-tag, .fr-else, .fr-end { cursor: pointer; }
.sq-frame.sel .fr-box, .sq-frame.sel .fr-tagbg, .fr-else.sel .fr-div { stroke: var(--accent); stroke-width: 2; }
.sq-frame.hl .fr-box, .fr-else.hl .fr-div { stroke: var(--err); stroke-width: 2.2; }
/* author mode */
.app.authoring .layout { grid-template-columns: minmax(240px, 300px) minmax(0, 1fr) 420px; }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.a-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.chip { font: 600 11px/1 var(--f-mono); padding: 5px 8px; border-radius: 999px; background: var(--sunk); color: var(--ink-2); }
.chip.warn { background: var(--note-soft); color: var(--note); }
.qtab .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--note); display: inline-block; }
.a-summary { font-size: 12px; font-weight: 600; margin-left: auto; }
.a-summary.ok, .a-good, .a-ok { color: var(--ok); }
.a-summary.bad, .a-bad, .a-err { color: var(--err); }
.a-err { font-size: 12.5px; margin: 4px 0; }
.a-top { margin-bottom: 6px; }
.a-hint { font-size: 12.5px; color: var(--ink-2); margin: 0 0 10px; }
.a-sec { border-top: 1px solid var(--rule); }
.a-sec > summary { cursor: pointer; padding: 10px 0; font: 600 14px/1.2 var(--f-display); list-style-position: outside; }
.a-sec > summary .muted { font: 500 12px var(--f-mono); }
.a-body { padding-bottom: 12px; }
.a-card { border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; min-width: 0; }
details.a-card > summary { cursor: pointer; }
details.a-card[open] > summary { margin-bottom: 8px; }
.a-cardhead { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.a-cardhead input { flex: 1; min-width: 0; border: 1px solid var(--rule); background: var(--paper); border-radius: 6px; padding: 4px 8px; }
.a-code { width: 100%; font: 12px/1.45 var(--f-mono); border: 1px solid var(--rule); background: var(--paper); border-radius: 6px; padding: 6px 8px; resize: vertical; }
.a-mem { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 5px 0; border-bottom: 1px dashed var(--rule); }
.a-mem:last-child { border-bottom: 0; }
.a-mem code { font-size: 12px; word-break: break-all; }
.a-mem .check { margin: 0; }
.a-inline { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
.a-inline input { border: 1px solid var(--rule); background: var(--paper); border-radius: 6px; padding: 3px 6px; font: 12px var(--f-mono); color: var(--ink); width: 9.5em; }
.a-inline input.a-num { width: 4.5em; }
.a-chips { display: flex; flex-wrap: wrap; gap: 0 12px; margin-bottom: 10px; }
.a-chips .check { margin-bottom: 2px; }
.a-req { align-self: end; margin-bottom: 18px; }
.a-node { margin-left: calc(var(--d) * 12px); border-left: 2px solid var(--rule); padding-left: 8px; }
.a-dia { display: flex; flex-direction: column; gap: 6px; padding: 8px 0; border-bottom: 1px dashed var(--rule); }
.a-dia > div:first-child { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; }
.a-list { list-style: none; padding: 0; margin: 6px 0; display: flex; flex-direction: column; gap: 6px; }
.a-list > li { border: 1px solid var(--rule); border-radius: 6px; padding: 7px 9px; font-size: 13px; }
.a-list > li.bad { border-color: var(--err); background: var(--err-soft); }
.a-list .actions { margin-top: 6px; }
.a-sub { font-size: 12px; color: var(--ink-2); margin-top: 3px; }
.a-exrow { display: flex; gap: 8px; align-items: center; }
.a-exrow input { flex: 1; min-width: 0; border: 1px solid var(--rule); background: var(--paper); border-radius: 6px; padding: 4px 7px; }
.a-exp { font: 12px var(--f-mono); color: var(--ink-2); white-space: nowrap; }
.a-st { width: 1em; text-align: center; font-weight: 700; }
.a-passed summary { cursor: pointer; font-size: 12.5px; color: var(--ink-2); }
.actions select, .actions input { border: 1px solid var(--rule); background: var(--paper); border-radius: 6px; padding: 4px 7px; }
.ghost { position: fixed; pointer-events: none; z-index: 20; background: var(--panel); border: 1.5px dashed var(--accent); border-radius: 4px; padding: 6px 12px; font: 12px var(--f-mono); }

/* side panel */
.tabs { display: flex; border-bottom: 1px solid var(--rule); }
.tabs button { flex: 1; border: 0; background: none; padding: 10px; cursor: pointer; font-weight: 500; color: var(--ink-2); border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.tabpanel { flex: 1; overflow: auto; padding: 14px 16px 24px; min-height: 0; }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.field > span, .fieldlabel { font-size: 12px; color: var(--ink-2); font-weight: 500; }
.field input, .field select, .field textarea { border: 1px solid var(--rule); background: var(--paper); border-radius: 6px; padding: 6px 8px; width: 100%; }
.field textarea { font: 12.5px/1.5 var(--f-mono); resize: vertical; min-height: 64px; }
.field input.mono { font-family: var(--f-mono); font-size: 12.5px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.check { display: flex; gap: 8px; align-items: center; font-size: 13px; margin-bottom: 6px; }
.endbox { border: 1px solid var(--rule); border-radius: 8px; padding: 10px 10px 2px; margin-bottom: 12px; }
.endbox h4 { margin: 0 0 8px; font: 600 12px var(--f-mono); }
.cheat { font: 12px/1.6 var(--f-mono); background: var(--sunk); border-radius: 6px; padding: 8px 10px; margin: 6px 0 12px; }
.cheat div { display: flex; justify-content: space-between; gap: 8px; }
.cheat span { color: var(--ink-2); font-family: var(--f-body); }
.help p { margin: 0 0 10px; }
.help h3, .side h3 { font: 600 15px/1.2 var(--f-display); margin: 4px 0 8px; }
.muted { color: var(--ink-2); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }

.score { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
.score .num { font: 700 40px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.score.clean .num { color: var(--ok); }
.score.dirty .num { color: var(--err); }
.score.part .num { color: var(--part); }
.score .lbl { font-weight: 600; }
.score .of { font: 600 20px/1 var(--f-display); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.issue.partial { background: var(--part-soft); }
.issue.partial .where { color: var(--part); }
.issue .cost { float: right; font: 600 11px/1.3 var(--f-mono); color: var(--ink-2); margin-left: 8px; }
.issues { list-style: none; margin: 10px 0 16px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.issue { border-radius: 6px; padding: 7px 9px; cursor: pointer; border: 1px solid transparent; }
.issue.error { background: var(--err-soft); }
.issue.note { background: var(--note-soft); }
.issue:hover { border-color: var(--ink-2); }
.issue .where { font: 600 11px/1.3 var(--f-mono); color: var(--ink-2); display: block; margin-bottom: 2px; }
.issue.error .where { color: var(--err); }
.issue.note .where { color: var(--note); }
.claude-out { white-space: pre-wrap; background: var(--sunk); border-radius: 6px; padding: 10px; font-size: 13px; margin-top: 8px; }

.modal { position: fixed; inset: 0; background: rgb(0 0 0 / .35); display: grid; place-items: center; padding: 16px; z-index: 30; }
.modal .card { background: var(--panel); border-radius: 10px; padding: 18px; width: min(640px, 100%); max-height: 90%; overflow: auto; border: 1px solid var(--rule); }
.modal textarea { width: 100%; min-height: 260px; font: 12px/1.45 var(--f-mono); border: 1px solid var(--rule); border-radius: 6px; padding: 8px; background: var(--paper); }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 8px 14px; border-radius: 999px; font-size: 13px; z-index: 40; }
.loaderr { padding: 24px; max-width: 60ch; }

@media (max-width: 1180px) {
  .layout, .app.authoring .layout { grid-template-columns: minmax(0, 1fr) 300px; grid-template-rows: auto minmax(0, 1fr); }
  .app.authoring .layout { grid-template-columns: minmax(0, 1fr) 380px; }
  .qpane { grid-column: 1 / 3; border-right: 0; border-bottom: 1px solid var(--rule); max-height: 34vh; }
}
@media (max-width: 760px) {
  .app { height: auto; }
  .qtabs { order: 3; flex-basis: 100%; }
  .brand { flex: 1; }
  .layout, .app.authoring .layout { display: flex; flex-direction: column; }
  .qpane { max-height: none; }
  .work { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto; }
  .toolbox { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--rule); padding: 8px; }
  .toolbox h2 { display: none; }
  .tile { flex: none; }
  .canvas-wrap { height: 60vh; }
  .side { border-left: 0; border-top: 1px solid var(--rule); }
}
@media (prefers-reduced-motion: no-preference) {
  .issue, .tile, .btn { transition: border-color .12s, background-color .12s; }
}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand">UML Drill <small>CS2103T</small></div>
    <nav class="qtabs" id="qtabs" aria-label="Questions"></nav>
    <button class="btn" id="btnAuthor" type="button" aria-pressed="false" title="Create and edit questions and answer keys">Author</button>

<script src="grader.js"></script>
<script src="author.js"></script>
<script>
(() => {
'use strict';
const NS = 'http://www.w3.org/2000/svg';
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = (x) => JSON.parse(JSON.stringify(x));
const uid = (p) => p + Math.random().toString(36).slice(2, 8);

// ---------------- state ----------------
const S = {
  questions: [],
  parts: [],        // flat list [{q, p, key, label}]
  cur: 0,
  diagrams: {},     // key -> diagram
  results: {},      // key -> grade result
  sel: null,        // {kind:'node'|'edge', id}
  tool: null,       // {type, navTo, label}
  pending: null,    // node id (first click of a line tool)
  view: 'mine',     // 'mine' | 'model'
  hl: null,         // {node} | {edge}
  side: 'edit',
  zoom: 'fit',
};
const curPart = () => S.parts[S.cur];
const emptyFor = (p) => clone(p.starter || (p.mode === 'sequence' ? { lifelines: [], rows: [] } : { nodes: [], edges: [] }));
const curDiagram = () => (S.view === 'model' ? curPart().p.model : S.diagrams[curPart().key]);

// ---------------- storage ----------------
const store = {
  get(k) { try { const v = localStorage.getItem('umldrill.v1.' + k); return v ? JSON.parse(v) : null; } catch { return null; } },
  set(k, v) { try { localStorage.setItem('umldrill.v1.' + k, JSON.stringify(v)); } catch {} },
};
let saveTimer = null;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { const P = curPart(); if (P) store.set(P.key, S.diagrams[P.key]); }, 250);
}

// ---------------- tools ----------------
const BOX_TOOLS = [
  { id: 'class', label: 'Class', node: { kind: 'class', stereo: '', name: 'NewClass' } },
  { id: 'interface', label: 'Interface', node: { kind: 'class', stereo: 'interface', name: 'NewInterface' } },
  { id: 'abstract', label: 'Abstract class', node: { kind: 'class', stereo: 'abstract', name: 'NewAbstract' } },
  { id: 'enum', label: 'Enumeration', node: { kind: 'class', stereo: 'enumeration', name: 'NewEnum', attrs: ['VALUE'] } },
  { id: 'object', label: 'Object', node: { kind: 'object', stereo: '', name: ':NewObject' } },
];
const LINE_TOOLS = [
  { id: 'association', label: 'Association', type: 'association', hint: 'click one class, then the other.' },
  { id: 'navigable', label: 'Navigable →', type: 'association', navTo: true, hint: 'click the class that holds the reference, then the class it points to.' },
  { id: 'inheritance', label: 'Inheritance', type: 'inheritance', hint: 'click the child class, then the parent.' },
  { id: 'realization', label: 'Realization', type: 'realization', hint: 'click the implementing class, then the interface.' },
  { id: 'dependency', label: 'Dependency', type: 'dependency', hint: 'click the class that uses, then the class it uses.' },
  { id: 'composition', label: 'Composition', type: 'composition', hint: 'click the whole, then the part.' },
  { id: 'aggregation', label: 'Aggregation', type: 'aggregation', hint: 'click the whole, then the part.' },
  { id: 'link', label: 'Object link', type: 'link', hint: 'click one object, then the other.' },
];
const ACT_BOX_TOOLS = [
  { id: 'a-start', label: 'Start', node: { kind: 'start', name: '' } },
  { id: 'a-action', label: 'Action', node: { kind: 'action', name: 'New action' } },
  { id: 'a-decision', label: 'Branch / merge', node: { kind: 'decision', name: '' } },
  { id: 'a-bar', label: 'Fork / join', node: { kind: 'bar', name: '', w: 220 } },
  { id: 'a-end', label: 'End', node: { kind: 'end', name: '' } },
];
const ACT_LINE_TOOLS = [
  { id: 'a-flow', label: 'Flow', type: 'flow', hint: 'click where the flow starts, then where it goes.' },
];
const boxTools = () => (isAct() ? ACT_BOX_TOOLS : BOX_TOOLS);
const GLYPH = {
  'a-start': '<circle class="g-solid" cx="15" cy="10" r="5.5"/>',
  'a-action': '<rect class="g-fill" x="3" y="4" width="24" height="12" rx="5"/>',
  'a-decision': '<path class="g-fill" d="M15 2l8 8-8 8-8-8z"/>',
  'a-bar': '<rect class="g-solid" x="3" y="8" width="24" height="4" rx="1"/>',
  'a-end': '<circle class="g-fill" cx="15" cy="10" r="7"/><circle class="g-solid" cx="15" cy="10" r="3.8"/>',
  'a-flow': '<path class="g-ink" d="M2 10h25M21 6l6 4-6 4"/>',
  class: '<rect class="g-fill" x="4" y="2" width="22" height="16" rx="1"/><path class="g-ink" d="M4 7.5h22M4 12.5h22"/>',
  interface: '<rect class="g-fill" x="4" y="2" width="22" height="16" rx="1"/><path class="g-ink" d="M4 9h22"/><text x="15" y="7.6" font-size="5.5" text-anchor="middle" fill="currentColor" font-family="monospace">«i»</text>',
  abstract: '<rect class="g-fill" x="4" y="2" width="22" height="16" rx="1"/><path class="g-ink" d="M4 9h22"/><text x="15" y="8" font-size="7" font-style="italic" text-anchor="middle" fill="currentColor" font-family="serif">A</text>',
  enum: '<rect class="g-fill" x="4" y="2" width="22" height="16" rx="1"/><path class="g-ink" d="M4 7h22M8 10.5h10M8 13.5h8"/>',
  object: '<rect class="g-fill" x="4" y="2" width="22" height="16" rx="1"/><path class="g-ink" d="M4 9h22M9 6.6h12"/>',
  association: '<path class="g-ink" d="M2 10h26"/>',
  navigable: '<path class="g-ink" d="M2 10h25M21 6l6 4-6 4"/>',
  inheritance: '<path class="g-ink" d="M2 10h18"/><path class="g-fill" d="M20 5l8 5-8 5z"/>',
  realization: '<path class="g-ink" d="M2 10h18" stroke-dasharray="3 2"/><path class="g-fill" d="M20 5l8 5-8 5z"/>',
  dependency: '<path class="g-ink" d="M2 10h25" stroke-dasharray="3 2"/><path class="g-ink" d="M21 6l6 4-6 4"/>',
  composition: '<path class="g-solid" d="M2 10l5-4 5 4-5 4z"/><path class="g-ink" d="M12 10h16"/>',
  aggregation: '<path class="g-fill" d="M2 10l5-4 5 4-5 4z"/><path class="g-ink" d="M12 10h16"/>',
  link: '<path class="g-ink" d="M4 10h22"/><circle class="g-ink" cx="4" cy="10" r="1.6"/><circle class="g-ink" cx="26" cy="10" r="1.6"/>',
};
const TYPE_LABEL = { association: 'Association', composition: 'Composition', aggregation: 'Aggregation', inheritance: 'Inheritance', realization: 'Realization', dependency: 'Dependency', link: 'Object link' };

function renderToolbox() {
  const tb = $('#toolbox');
  const tile = (t, cls) => `<button type="button" class="tile ${cls}" data-tool="${t.id}" aria-pressed="${S.tool && S.tool.id === t.id}"><svg viewBox="0 0 30 20" aria-hidden="true">${GLYPH[t.id]}</svg>${esc(t.label)}</button>`;
  if (isSeq()) {
    tb.innerHTML = '<h2>Lifelines</h2>' + SEQ_LIFE_TOOLS.map((t) => tile(t, 'box')).join('') + '<h2>Messages</h2>' + SEQ_MSG_TOOLS.map((t) => tile(t, 'line')).join('') + '<h2>Frames</h2>' + SEQ_FRAME_TOOLS.map((t) => tile(t, 'line')).join('');
    return;
  }
  if (isAct()) {
    tb.innerHTML = '<h2>Nodes</h2>' + ACT_BOX_TOOLS.map((t) => tile(t, 'box')).join('') + '<h2>Lines</h2>' + ACT_LINE_TOOLS.map((t) => tile(t, 'line')).join('');
    return;
  }
  tb.innerHTML = '<h2>Boxes</h2>' + BOX_TOOLS.map((t) => tile(t, 'box')).join('') + '<h2>Lines</h2>' + LINE_TOOLS.map((t) => tile(t, 'line')).join('');
}

// ---------------- text measuring ----------------
const mctx = document.createElement('canvas').getContext('2d');
function tw(s, size = 12.5, bold = false, italic = false) {
  mctx.font = `${italic ? 'italic ' : ''}${bold ? '600 ' : ''}${size}px "JetBrains Mono", ui-monospace, monospace`;
  return mctx.measureText(s).width;
}
function displayMember(raw) {
  let t = String(raw).trim();
  let underline = false;
  if (/\{\s*static\s*\}/i.test(t)) { underline = true; t = t.replace(/\s*\{\s*static\s*\}\s*/gi, ' ').trim(); }
  if (t.length > 2 && t[0] === '_' && t[t.length - 1] === '_') { underline = true; t = t.slice(1, -1).trim(); }
  const italic = /\{\s*abstract\s*\}/i.test(t);
  return { t, underline, italic };
}
const LH = 18, PADX = 10;
function layoutNode(n) {
  const head = [];
  if (n.kind !== 'object') {
    if (n.stereo === 'interface') head.push({ t: '«interface»', small: true });
    if (n.stereo === 'enumeration') head.push({ t: '«enumeration»', small: true });
    if (n.stereo === 'abstract') head.push({ t: '{abstract}', small: true });
  }
  head.push({ t: n.name || '(no name)', bold: true, italic: n.kind !== 'object' && n.stereo === 'abstract', underline: n.kind === 'object', ph: !n.name });
  const attrs = (n.attrs || []).filter((s) => String(s).trim()).map(displayMember);
  const methods = (n.methods || []).filter((s) => String(s).trim()).map(displayMember);
  const showMeth = n.kind !== 'object' || methods.length > 0;
  let w = 104;
  for (const h of head) w = Math.max(w, tw(h.t, h.small ? 11 : 12.5, h.bold, h.italic));
  for (const m of attrs.concat(methods)) w = Math.max(w, tw(m.t, 12.5, false, m.italic));
  w = Math.ceil(w + PADX * 2);
  const hHead = 8 + head.length * LH;
  const hAttr = attrs.length ? attrs.length * LH + 8 : 14;
  const hMeth = showMeth ? (methods.length ? methods.length * LH + 8 : 14) : 0;
  return { w, h: hHead + hAttr + hMeth, hHead, hAttr, hMeth, head, attrs, methods, showMeth };
}

function wrapText(s, maxW, size = 12.5) {
  const out = [];
  let cur = '';
  for (const w of String(s).split(/\s+/).filter(Boolean)) {
    const t = cur ? cur + ' ' + w : w;
    if (cur && tw(t, size) > maxW) { out.push(cur); cur = w; } else cur = t;
  }
  if (cur) out.push(cur);
  return out.length ? out : [''];
}
/** Size of an activity node; actions and labelled diamonds wrap their text. */
function layoutAct(n) {
  if (n.kind === 'start') return { w: 26, h: 26 };
  if (n.kind === 'end') return { w: 28, h: 28 };
  if (n.kind === 'bar') return { w: Math.max(40, +n.w || 220), h: 8 };
  const name = String(n.name || '').trim();
  if (n.kind === 'decision') {
    if (!name) return { w: 40, h: 40, lines: [] };
    const lines = wrapText(name, 120, 11.5);
    const tW = Math.max(...lines.map((l) => tw(l, 11.5)));
    return { w: Math.ceil(tW * 2 + 24), h: Math.max(50, lines.length * 15 * 2 + 18), lines };
  }
  const lines = wrapText(name || 'Action', 200);
  return { w: Math.min(260, Math.max(120, Math.ceil(Math.max(...lines.map((l) => tw(l))) + 28))), h: Math.max(44, lines.length * 17 + 20), lines, ph: !name };
}

// ---------------- svg helpers ----------------
function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}
function text(parent, x, y, str, opts = {}) {
  const t = el('text', { x, y, 'text-anchor': opts.anchor || 'start', class: opts.cls, 'font-weight': opts.bold ? 600 : null, 'font-style': opts.italic ? 'italic' : null, 'text-decoration': opts.underline ? 'underline' : null }, parent);
  t.textContent = str;
  return t;
}
function clip(p, q, b) {
  // point where segment p->q leaves rect b (p inside b)
  const dx = q.x - p.x, dy = q.y - p.y;
  let t = Infinity;
  if (dx > 0) t = Math.min(t, (b.x + b.w - p.x) / dx);
  if (dx < 0) t = Math.min(t, (b.x - p.x) / dx);
  if (dy > 0) t = Math.min(t, (b.y + b.h - p.y) / dy);
  if (dy < 0) t = Math.min(t, (b.y - p.y) / dy);
  if (!isFinite(t) || t < 0) t = 0;
  return { x: p.x + dx * t, y: p.y + dy * t };
}
const pts = (arr) => arr.map((p) => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');

// ---------------- canvas render ----------------
const svg = $('#canvas');
let boxes = {}; // id -> {x,y,w,h}

function renderCanvas() {
  const P = curPart();
  if (!P) return;
  if (isSeq()) { renderSeq(); return; }
  const d = curDiagram();
  const ro = S.view === 'model';
  svg.innerHTML = '';
  svg.classList.toggle('readonly', ro);
  boxes = {};
  const layouts = {};
  for (const n of d.nodes) {
    const L = isAct() ? layoutAct(n) : layoutNode(n);
    layouts[n.id] = L;
    boxes[n.id] = { x: n.x, y: n.y, w: L.w, h: L.h };
  }
  const cw = Math.max(P.p.canvas?.width || 1000, ...Object.values(boxes).map((b) => b.x + b.w + 60));
  const ch = Math.max(P.p.canvas?.height || 640, ...Object.values(boxes).map((b) => b.y + b.h + 60));
  svg.setAttribute('viewBox', `0 0 ${cw} ${ch}`);
  const wrapW = $('#canvasWrap').clientWidth || cw;
  const z = S.zoom === 'fit' ? Math.min(1, Math.max(0.35, (wrapW - 4) / cw)) : S.zoom;
  S.zNow = z;
  svg.setAttribute('width', Math.round(cw * z));
  svg.setAttribute('height', Math.round(ch * z));

  const defs = el('defs', {}, svg);
  const pat = el('pattern', { id: 'gridpat', width: 20, height: 20, patternUnits: 'userSpaceOnUse' }, defs);
  el('rect', { width: 20, height: 20, class: 'page' }, pat);
  el('path', { d: 'M20 0H0V20', class: 'gridline' }, pat);
  el('rect', { x: 0, y: 0, width: cw, height: ch, class: 'bg', 'data-bg': '1' }, svg);

  // edges
  const gE = el('g', {}, svg);
  const pairCount = {}, pairIdx = {};
  const pk = (e) => [e.from, e.to].sort().join('|');
  for (const e of d.edges) pairCount[pk(e)] = (pairCount[pk(e)] || 0) + 1;
  const selfIdx = {};
  const routeK = { left: 0, right: 0 };
  for (const e of d.edges) {
    if (!boxes[e.from] || !boxes[e.to]) continue;
    if (isAct()) {
      if (e.route === 'left' || e.route === 'right') { drawFlow(gE, e, 0, routeK[e.route]++); continue; }
      const k = pk(e), i = (pairIdx[k] = (pairIdx[k] ?? -1) + 1);
      drawFlow(gE, e, ([e.from, e.to].sort()[0] === e.from ? 1 : -1) * (i - (pairCount[k] - 1) / 2), 0);
      continue;
    }
    if (e.from === e.to) { selfIdx[e.from] = (selfIdx[e.from] ?? -1) + 1; drawSelfEdge(gE, e, selfIdx[e.from]); continue; }
    const k = pk(e);
    const i = (pairIdx[k] = (pairIdx[k] ?? -1) + 1);
    // the offset is measured along the line's own normal, so flip it for lines drawn the other way round
    const flip = [e.from, e.to].sort()[0] === e.from ? 1 : -1;
    drawEdge(gE, e, flip * (i - (pairCount[k] - 1) / 2));
  }

  // nodes
  for (const n of d.nodes) (isAct() ? drawActNode : drawNode)(svg, n, layouts[n.id]);
}

function drawActNode(parent, n, L) {
  const cls = ['node'];
  if (S.view === 'mine' && S.sel && S.sel.kind === 'node' && S.sel.id === n.id) cls.push('sel');
  if (S.pending === n.id) cls.push('pending');
  if (S.hl && S.hl.node === n.id) cls.push('hl');
  const g = el('g', { class: cls.join(' '), transform: `translate(${n.x},${n.y})`, 'data-node': n.id }, parent);
  const mid = (lines, size, cl) => lines.forEach((t, i) => text(g, L.w / 2, L.h / 2 + (i - (lines.length - 1) / 2) * (size + 4) + size * 0.36, t, { anchor: 'middle', cls: cl }));
  if (n.kind === 'start') el('circle', { class: 'box solid', cx: 13, cy: 13, r: 13 }, g);
  else if (n.kind === 'end') { el('circle', { class: 'box', cx: 14, cy: 14, r: 13.5 }, g); el('circle', { class: 'solid', cx: 14, cy: 14, r: 8 }, g); }
  else if (n.kind === 'bar') { el('rect', { class: 'hit-r', x: -4, y: -9, width: L.w + 8, height: L.h + 18 }, g); el('rect', { class: 'box solid', x: 0, y: 0, width: L.w, height: L.h, rx: 1.5 }, g); }
  else if (n.kind === 'decision') { el('polygon', { class: 'box', points: pts([{ x: L.w / 2, y: 0 }, { x: L.w, y: L.h / 2 }, { x: L.w / 2, y: L.h }, { x: 0, y: L.h / 2 }]) }, g); mid(L.lines, 11.5, 'dtext'); }
  else { el('rect', { class: 'box', x: 0, y: 0, width: L.w, height: L.h, rx: 12 }, g); mid(L.lines, 12.5, L.ph ? 'ph' : null); }
}

/** Point where a line from c toward "toward" leaves an activity node's shape. */
function actEdgePoint(n, b, c, toward) {
  const dx = toward.x - c.x, dy = toward.y - c.y, len = Math.hypot(dx, dy) || 1;
  if (n.kind === 'start' || n.kind === 'end') return { x: c.x + (dx / len) * (b.w / 2), y: c.y + (dy / len) * (b.h / 2) };
  if (n.kind === 'decision') { const t = 1 / (Math.abs(dx) / (b.w / 2) + Math.abs(dy) / (b.h / 2) || 1); return { x: c.x + dx * t, y: c.y + dy * t }; }
  return clip(c, toward, b);
}
/** A control flow: straight, or around the left/right of everything in between (for loops back up). */
function drawFlow(parent, e, offsetIndex, routeIdx) {
  const A = boxes[e.from], B = boxes[e.to];
  const nA = nodeById(e.from), nB = nodeById(e.to);
  const cls = ['edge'];
  if (S.view === 'mine' && S.sel && S.sel.kind === 'edge' && S.sel.id === e.id) cls.push('sel');
  if (S.hl && S.hl.edge === e.id) cls.push('hl');
  const g = el('g', { class: cls.join(' '), 'data-edge': e.id }, parent);
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  let path;
  if (e.route === 'left' || e.route === 'right') {
    const right = e.route === 'right';
    const ya = A.y + A.h / 2, yb = B.y + B.h / 2;
    const lo = Math.min(A.y, B.y), hi = Math.max(A.y + A.h, B.y + B.h);
    const span = Object.values(boxes).filter((b) => b.y < hi && b.y + b.h > lo);
    const X = right ? Math.max(...span.map((b) => b.x + b.w)) + 30 + routeIdx * 16 : Math.max(8, Math.min(...span.map((b) => b.x)) - 30 - routeIdx * 16);
    path = [{ x: right ? A.x + A.w : A.x, y: ya }, { x: X, y: ya }, { x: X, y: yb }, { x: right ? B.x + B.w : B.x, y: yb }];
  } else {
    const ca = { x: A.x + A.w / 2, y: A.y + A.h / 2 }, cb = { x: B.x + B.w / 2, y: B.y + B.h / 2 };
    if (nA.kind === 'bar' && nB.kind === 'bar') { const x = (Math.max(A.x, B.x) + Math.min(A.x + A.w, B.x + B.w)) / 2; ca.x = cb.x = x; }
    else if (nA.kind === 'bar') ca.x = clamp(cb.x, A.x + 12, A.x + A.w - 12);
    else if (nB.kind === 'bar') cb.x = clamp(ca.x, B.x + 12, B.x + B.w - 12);
    const len = Math.hypot(cb.x - ca.x, cb.y - ca.y) || 1;
    const off = offsetIndex * 18, ox = (-(cb.y - ca.y) / len) * off, oy = ((cb.x - ca.x) / len) * off;
    const sa = { x: ca.x + ox, y: ca.y + oy }, sb = { x: cb.x + ox, y: cb.y + oy };
    path = [actEdgePoint(nA, A, sa, sb), actEdgePoint(nB, B, sb, sa)];
  }
  const tip = path[path.length - 1], prev = path[path.length - 2];
  const sl = Math.hypot(tip.x - prev.x, tip.y - prev.y) || 1, ux = (tip.x - prev.x) / sl, uy = (tip.y - prev.y) / sl;
  el('polyline', { class: 'stroke', points: pts(path), fill: 'none' }, g);
  el('polyline', { class: 'deco open', points: pts([{ x: tip.x - ux * 11 - uy * 6, y: tip.y - uy * 11 + ux * 6 }, tip, { x: tip.x - ux * 11 + uy * 6, y: tip.y - uy * 11 - ux * 6 }]) }, g);
  el('polyline', { class: 'hit', points: pts(path), fill: 'none' }, g);
  const guard = String(e.guard || '').trim().replace(/^\[\s*|\s*\]$/g, '');
  if (guard) {
    // near the diamond it leaves, beside the first segment
    const p0 = path[0], p1 = path[1];
    const l0 = Math.hypot(p1.x - p0.x, p1.y - p0.y) || 1, vx = (p1.x - p0.x) / l0, vy = (p1.y - p0.y) / l0;
    const along = nA.kind === 'decision' ? Math.min(20, l0 / 2) : l0 / 2;
    const bx = p0.x + vx * along, by = p0.y + vy * along;
    if (Math.abs(vx) >= Math.abs(vy)) text(g, bx + (vx > 0 ? 2 : -2), by - 6, `[${guard}]`, { anchor: vx > 0 ? 'start' : 'end' });
    else text(g, bx + 7, by + (vy > 0 ? 10 : -4), `[${guard}]`, { anchor: 'start' });
  }
}

function drawNode(parent, n, L) {
  const cls = ['node'];
  if (S.view === 'mine' && S.sel && S.sel.kind === 'node' && S.sel.id === n.id) cls.push('sel');
  if (S.pending === n.id) cls.push('pending');
  if (S.hl && S.hl.node === n.id) cls.push('hl');
  const g = el('g', { class: cls.join(' '), transform: `translate(${n.x},${n.y})`, 'data-node': n.id }, parent);
  el('rect', { class: 'box', x: 0, y: 0, width: L.w, height: L.h, rx: 1.5 }, g);
  let y = 4;
  L.head.forEach((h) => {
    y += LH;
    text(g, L.w / 2, y - 4, h.t, { anchor: 'middle', bold: h.bold, italic: h.italic, underline: h.underline, cls: h.small ? 'small' : h.ph ? 'ph' : null });
  });
  y = L.hHead;
  el('line', { class: 'sep', x1: 0, x2: L.w, y1: y, y2: y }, g);
  let yy = y + 4;
  L.attrs.forEach((m) => { yy += LH; text(g, PADX, yy - 4, m.t, { italic: m.italic, underline: m.underline }); });
  if (L.showMeth) {
    y = L.hHead + L.hAttr;
    el('line', { class: 'sep', x1: 0, x2: L.w, y1: y, y2: y }, g);
    yy = y + 4;
    L.methods.forEach((m) => { yy += LH; text(g, PADX, yy - 4, m.t, { italic: m.italic, underline: m.underline }); });
  }
}

function drawEdge(parent, e, offsetIndex) {
  const A = boxes[e.from], B = boxes[e.to];
  const ca = { x: A.x + A.w / 2, y: A.y + A.h / 2 }, cb = { x: B.x + B.w / 2, y: B.y + B.h / 2 };
  let dx = cb.x - ca.x, dy = cb.y - ca.y;
  const len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len, ny = dx / len;
  const off = offsetIndex * 28; // wide enough that one line's labels clear its neighbour
  const sa = { x: ca.x + nx * off, y: ca.y + ny * off }, sb = { x: cb.x + nx * off, y: cb.y + ny * off };
  const pa = clip(sa, sb, A), pb = clip(sb, sa, B);
  const ux = (pb.x - pa.x) / (Math.hypot(pb.x - pa.x, pb.y - pa.y) || 1), uy = (pb.y - pa.y) / (Math.hypot(pb.x - pa.x, pb.y - pa.y) || 1);
  const u = { x: ux, y: uy }, n = { x: -uy, y: ux };
  const at = (p, along, side) => ({ x: p.x + u.x * along + n.x * side, y: p.y + u.y * along + n.y * side });

  const cls = ['edge'];
  if (S.view === 'mine' && S.sel && S.sel.kind === 'edge' && S.sel.id === e.id) cls.push('sel');
  if (S.hl && S.hl.edge === e.id) cls.push('hl');
  const g = el('g', { class: cls.join(' '), 'data-edge': e.id }, parent);

  let start = pa, end = pb;
  const decos = [];
  const tri = (tip) => { decos.push({ d: [tip, at(tip, -14, 7.5), at(tip, -14, -7.5)], kind: '' }); return at(tip, -14, 0); };
  const arrow = (tip, back) => {
    const s = back ? -1 : 1;
    decos.push({ d: [at(tip, -12 * s, 6.5), tip, at(tip, -12 * s, -6.5)], kind: 'open', open: true });
  };
  const diamond = (base, solid) => { decos.push({ d: [base, at(base, 10, 6), at(base, 20, 0), at(base, 10, -6)], kind: solid ? 'solid' : '' }); return at(base, 20, 0); };

  if (e.type === 'inheritance' || e.type === 'realization') end = tri(pb);
  if (e.type === 'dependency') arrow(pb);
  if (e.type === 'composition') start = diamond(pa, true);
  if (e.type === 'aggregation') start = diamond(pa, false);
  if (['association', 'composition', 'aggregation', 'link'].includes(e.type)) {
    if (e.navTo) arrow(pb);
    if (e.navFrom) arrow(pa, true);
  }
  const dashed = e.type === 'realization' || e.type === 'dependency';
  el('line', { class: 'stroke' + (dashed ? ' dash' : ''), x1: start.x, y1: start.y, x2: end.x, y2: end.y }, g);
  for (const dc of decos) el(dc.open ? 'polyline' : 'polygon', { class: 'deco ' + dc.kind, points: pts(dc.d) }, g);
  el('line', { class: 'hit', x1: pa.x, y1: pa.y, x2: pb.x, y2: pb.y }, g);

  // place a label beside the line; anchor it away from the line so it never sits on the stroke
  const lab = (base, along, side, s) => {
    if (!s || !String(s).trim()) return;
    const p = at(base, along, side);
    const sx = n.x * Math.sign(side), sy = n.y * Math.sign(side);
    const anchor = sx > 0.35 ? 'start' : sx < -0.35 ? 'end' : 'middle';
    const dy = Math.abs(n.y) > 0.35 ? (sy > 0 ? 12 : -3) : 4;
    text(g, p.x, p.y + dy, String(s).trim(), { anchor });
  };
  lab(pa, 30, 9, e.fromMult);
  lab(pa, 30, -9, e.fromRole);
  lab(pb, -30, 9, e.toMult);
  lab(pb, -30, -9, e.toRole);
  if (e.label) lab({ x: (pa.x + pb.x) / 2, y: (pa.y + pb.y) / 2 }, 0, 10, e.label);
}

/**
 * A class that refers to itself: a loop out of the top edge and back into the left edge,
 * near the top-left corner (lines to other classes usually leave from the right or below).
 * "from" is the top end, "to" (arrowhead, multiplicity) the left end.
 */
function drawSelfEdge(parent, e, k) {
  const A = boxes[e.from];
  const r = 34 + k * 18;                                    // later loops sit outside earlier ones
  const p0 = { x: A.x + r, y: A.y };                        // leaves the top edge
  const p3 = { x: A.x, y: A.y + r };                        // re-enters the left edge
  const p1 = { x: p0.x, y: A.y - r }, p2 = { x: A.x - r, y: A.y - r }, p2b = { x: p2.x, y: p3.y };
  const cls = ['edge'];
  if (S.view === 'mine' && S.sel && S.sel.kind === 'edge' && S.sel.id === e.id) cls.push('sel');
  if (S.hl && S.hl.edge === e.id) cls.push('hl');
  const g = el('g', { class: cls.join(' '), 'data-edge': e.id }, parent);
  let start = p0;
  const decos = [];
  if (e.type === 'composition' || e.type === 'aggregation') {
    decos.push({ d: [p0, { x: p0.x - 6, y: p0.y - 10 }, { x: p0.x, y: p0.y - 20 }, { x: p0.x + 6, y: p0.y - 10 }], kind: e.type === 'composition' ? 'solid' : '' });
    start = { x: p0.x, y: p0.y - 20 };
  }
  if (e.navTo) decos.push({ d: [{ x: p3.x - 12, y: p3.y - 6.5 }, p3, { x: p3.x - 12, y: p3.y + 6.5 }], open: true, kind: 'open' });
  if (e.navFrom) decos.push({ d: [{ x: p0.x - 6.5, y: p0.y - 12 }, p0, { x: p0.x + 6.5, y: p0.y - 12 }], open: true, kind: 'open' });
  const path = [start, p1, p2, p2b, p3];
  el('polyline', { class: 'stroke' + (e.type === 'dependency' ? ' dash' : ''), points: pts(path), fill: 'none' }, g);
  for (const dc of decos) el(dc.open ? 'polyline' : 'polygon', { class: 'deco ' + dc.kind, points: pts(dc.d) }, g);
  el('polyline', { class: 'hit', points: pts([p0, p1, p2, p2b, p3]), fill: 'none' }, g);
  const lab = (x, y, s, anchor) => { if (s && String(s).trim()) text(g, x, y, String(s).trim(), { anchor }); };
  lab(p3.x - 6, p3.y + 16, e.toMult, 'end');                 // below the arrowhead
  lab(p2.x - 6, (p2.y + p3.y) / 2 + 4, e.toRole, 'end');      // beside the left-hand leg
  lab(p0.x + 6, p0.y - 6, e.fromMult, 'start');
  lab(p0.x + 6, p1.y + 14, e.fromRole, 'start');
  if (e.label) lab((p1.x + p2.x) / 2, p1.y - 6, e.label, 'middle');
}

// ---------------- canvas interaction ----------------
function svgPoint(evt) {
  const m = svg.getScreenCTM();
  if (!m) return { x: 0, y: 0 };
  const p = new DOMPoint(evt.clientX, evt.clientY).matrixTransform(m.inverse());
  return { x: p.x, y: p.y };
}
let drag = null;
svg.addEventListener('pointerdown', (evt) => {
  if (S.view === 'model') return;
  if (isSeq()) { seqPointerDown(evt); return; }
  const d = curDiagram();
  const nodeEl = evt.target.closest('[data-node]');
  const edgeEl = evt.target.closest('[data-edge]');
  if (S.tool) {
    if (nodeEl) {
      const id = nodeEl.dataset.node;
      if (!S.pending) { S.pending = id; renderStatus(); renderCanvas(); return; }
      // the same box twice makes a self-association; other line types cannot point at their own class
      if (id === S.pending && !['association', 'composition', 'aggregation'].includes(S.tool.type)) return;
      const e = S.tool.type === 'flow' ? { id: uid('e'), type: 'flow', from: S.pending, to: id, guard: '' }
        : { id: uid('e'), type: S.tool.type, from: S.pending, to: id, navTo: !!S.tool.navTo, navFrom: false, fromMult: '', toMult: '', fromRole: '', toRole: '', label: '' };
      d.edges.push(e);
      S.pending = null; S.tool = null;
      select({ kind: 'edge', id: e.id });
      renderToolbox(); renderStatus(); save();
      return;
    }
    if (!edgeEl) { cancelTool(); }
    return;
  }
  if (nodeEl) {
    const id = nodeEl.dataset.node;
    const n = d.nodes.find((x) => x.id === id);
    const p = svgPoint(evt);
    drag = { id, dx: p.x - n.x, dy: p.y - n.y, moved: false, pid: evt.pointerId };
    svg.setPointerCapture(evt.pointerId);
    if (!(S.sel && S.sel.id === id)) select({ kind: 'node', id });
    return;
  }
  if (edgeEl) { select({ kind: 'edge', id: edgeEl.dataset.edge }); return; }
  select(null);
});
svg.addEventListener('pointermove', (evt) => {
  if (isSeq()) { seqPointerMove(evt); return; }
  if (!drag) return;
  const n = curDiagram().nodes.find((x) => x.id === drag.id);
  if (!n) return;
  const p = svgPoint(evt);
  const nx = Math.max(0, Math.round((p.x - drag.dx) / 10) * 10), ny = Math.max(0, Math.round((p.y - drag.dy) / 10) * 10);
  if (nx !== n.x || ny !== n.y) { n.x = nx; n.y = ny; drag.moved = true; renderCanvas(); }
});
const endDrag = () => { if (isSeq()) { seqPointerUp(); return; } if (drag && drag.moved) save(); drag = null; };
svg.addEventListener('pointerup', endDrag);
svg.addEventListener('pointercancel', endDrag);
svg.addEventListener('dblclick', () => {

$('#zIn').onclick = () => { S.zoom = Math.min(2, Math.round(((S.zNow || 1) + 0.15) * 100) / 100); renderCanvas(); };
$('#zOut').onclick = () => { S.zoom = Math.max(0.35, Math.round(((S.zNow || 1) - 0.15) * 100) / 100); renderCanvas(); };

// Toolbox: click to add / pick a line tool; drag a box onto the canvas.
let tdrag = null;
$('#toolbox').addEventListener('pointerdown', (evt) => {
  const t = evt.target.closest('[data-tool]');
  if (!t) return;
  tdrag = { id: t.dataset.tool, x: evt.clientX, y: evt.clientY, ghost: null };
});
document.addEventListener('pointermove', (evt) => {
  if (!tdrag || isSeq() || !boxTools().some((b) => b.id === tdrag.id)) return;
  if (!tdrag.ghost && Math.hypot(evt.clientX - tdrag.x, evt.clientY - tdrag.y) > 6) {
    tdrag.ghost = document.createElement('div');
    tdrag.ghost.className = 'ghost';
    tdrag.ghost.textContent = boxTools().find((b) => b.id === tdrag.id).label;
    document.body.appendChild(tdrag.ghost);

  if (!tdrag) return;
  const td = tdrag; tdrag = null;

    const r = $('#canvasWrap').getBoundingClientRect();
    if (evt.clientX >= r.left && evt.clientX <= r.right && evt.clientY >= r.top && evt.clientY <= r.bottom) {

      addBox(td.id, { x: Math.round(p.x / 10) * 10 - 20, y: Math.round(p.y / 10) * 10 - 10 });

function pickTool(id) {
  if (S.view === 'model') showMine();

  if (!isSeq() && boxTools().some((b) => b.id === id)) { addBox(id); return; }
  const t = (isSeq() ? SEQ_ALL_TOOLS : isAct() ? ACT_LINE_TOOLS : LINE_TOOLS).find((l) => l.id === id);
  if (!t) return;
  if (S.tool && S.tool.id === id) { cancelTool(); return; }
  S.tool = t; S.pending = null;
  renderToolbox(); renderStatus(); renderCanvas();
}
function freeSpot() {
  const wrap = $('#canvasWrap');
  const d = curDiagram();
  const bx = Object.values(boxes);
  const x0 = Math.round((wrap.scrollLeft + 40) / 10) * 10, y0 = Math.round((wrap.scrollTop + 30) / 10) * 10;
  for (let row = 0; row < 12; row++) for (let col = 0; col < 6; col++) {
    const x = x0 + col * 170, y = y0 + row * 110;
    if (!bx.some((b) => x < b.x + b.w + 20 && x + 150 > b.x - 20 && y < b.y + b.h + 20 && y + 90 > b.y - 20)) return { x, y };
  }

}
function addBox(toolId, at) {

  const n = Object.assign(isAct() ? { id: uid('n') } : { id: uid('n'), attrs: [], methods: [] }, clone(t.node), { x: Math.max(0, pos.x), y: Math.max(0, pos.y) });
  curDiagram().nodes.push(n);
  S.tool = null; S.pending = null;
  renderToolbox();
  select({ kind: 'node', id: n.id });
  save();
  requestAnimationFrame(() => { const f = $('#f-name'); if (f) { f.focus(); f.select(); } });
}
