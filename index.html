const sqRowY = (i) => SQ.FIRST + i * SQ.ROW;
let G = null; // last sequence layout, used for hit testing

function lifeLabel(l) { return String(l.name || '').trim() || '(no name)'; }
function seqLayout(d) {
  const xs = {}, ws = {};
  let prevX = null, prevW = 0;
  for (const l of d.lifelines) {
    const w = l.kind === 'actor' ? Math.max(56, tw(lifeLabel(l), 12.5, true) + 12) : Math.max(92, tw(lifeLabel(l), 12.5, true) + 26);
    const x = prevX === null ? 150 + Math.max(0, (w - 92) / 2) : prevX + Math.max(150, (prevW + w) / 2 + 48);
    xs[l.id] = x; ws[l.id] = w; prevX = x; prevW = w;
  }
  xs['@start'] = SQ.START_X;
  const tree = UMLGrader.buildSeqTree(d);
  const createdAt = {}, deletedAt = {};
  d.rows.forEach((r, i) => {
    if (r.type === 'create' && createdAt[r.to] === undefined) createdAt[r.to] = i;
    if (r.type === 'delete' && deletedAt[r.to] === undefined) deletedAt[r.to] = i;
  });
  const bottom = sqRowY(Math.max(d.rows.length, 2)) + 16;
  const right = (prevX || 150) + prevW / 2 + 120;
  return { xs, ws, tree, createdAt, deletedAt, bottom, right };
}
function barX(who, depth) { return G.xs[who] + depth * 7; }
function senderAct(who, k) {
  let best = null;
  for (const a of G.tree.acts) if (a.who === who && a.start < k && a.end >= k && (!best || a.depth > best.depth)) best = a;
  return best;
}
function receiverAct(who, k) {
  let best = null;
  for (const a of G.tree.acts) if (a.who === who && a.start < k && a.end > k && (!best || a.depth > best.depth)) best = a;
  return best;
}
const edgeX = (who, act, towardX) => {
  if (who === '@start') return SQ.START_X;
  if (!act) return G.xs[who];
  const c = barX(who, act.depth);
  return towardX >= c ? c + 5 : c - 5;
};

function renderSeq() {
  const P = curPart();
  const d = curDiagram();
  const ro = S.view === 'model';
  svg.innerHTML = '';
  svg.classList.toggle('readonly', ro);
  G = seqLayout(d);
  const cw = Math.max(720, G.right);
  const ch = Math.max(420, G.bottom + 40);
  svg.setAttribute('viewBox', `0 0 ${cw} ${ch}`);
  const wrapW = $('#canvasWrap').clientWidth || cw;
  const z = S.zoom === 'fit' ? Math.min(1, Math.max(0.35, (wrapW - 4) / cw)) : S.zoom;
  S.zNow = z;
  svg.setAttribute('width', Math.round(cw * z));
  svg.setAttribute('height', Math.round(ch * z));

  const defs = el('defs', {}, svg);
  const pat = el('pattern', { id: 'gridpat', width: 20, height: 20, patternUnits: 'userSpaceOnUse' }, defs);
  el('rect', { width: 20, height: 20, class: 'page' }, pat);
  el('path', { d: 'M20 0H0V20', class: 'gridline' }, pat);
  el('rect', { x: 0, y: 0, width: cw, height: ch, class: 'bg' }, svg);

  // start guide (where incoming calls begin)
  const gS = el('g', { class: 'sq-start' }, svg);
  el('line', { x1: SQ.START_X, x2: SQ.START_X, y1: SQ.FIRST - 26, y2: G.bottom, class: 'sq-guide' }, gS);
  text(gS, SQ.START_X, SQ.FIRST - 32, 'start', { anchor: 'middle', cls: 'small' });

  // frames: boxes behind everything, labels on top (added to gTop at the end)
  const gF = el('g', {}, svg);
  const gTop = el('g', {});
  for (const f of G.tree.frames) drawFrame(gF, d, f, gTop);

  // lifelines
  const gL = el('g', {}, svg);
  for (const l of d.lifelines) drawLifeline(gL, l);

  // activation bars
  const gA = el('g', {}, svg);
  for (const a of G.tree.acts) {
    if (!d.lifelines.some((l) => l.id === a.who)) continue;
    const row = d.rows[a.start];
    let y1 = sqRowY(a.start);
    if (row && row.type === 'call' && row.from === row.to) y1 += 12;
    if (row && row.type === 'create') y1 += SQ.HEAD / 2;
    let y2 = sqRowY(a.end);
    if (y2 < y1 + 14) y2 = y1 + 14;
    el('rect', { class: 'sq-act', x: barX(a.who, a.depth) - 5, y: y1, width: 10, height: y2 - y1 }, gA);
  }

  // insertion guide while a tool is waiting for its second click
  if (S.tool && S.pending && S.pending.y !== undefined) {
    const gy = insertGuideY(insertIndex(S.pending.y));
    el('line', { x1: 0, x2: cw, y1: gy, y2: gy, class: 'sq-insert' }, svg);
  }

  // messages
  const gM = el('g', {}, svg);
  d.rows.forEach((row, k) => { if (['call', 'return', 'create', 'delete'].includes(row.type)) drawMessage(gM, d, row, k); });
  svg.appendChild(gTop);
}

function insertIndex(y) {
  const n = curDiagram().rows.length;
  if (y < SQ.FIRST - SQ.ROW / 2) return 0;
  return Math.max(0, Math.min(n, Math.floor((y - SQ.FIRST) / SQ.ROW) + 1));
}
function insertGuideY(idx) { return idx === 0 ? SQ.FIRST - SQ.ROW / 2 : sqRowY(idx - 1) + SQ.ROW / 2; }

function drawLifeline(parent, l) {
  const cls = ['node', 'sq-life'];
  if (S.view === 'mine' && S.sel && S.sel.kind === 'life' && S.sel.id === l.id) cls.push('sel');
  if (S.pending && S.pending.from === l.id) cls.push('pending');
  if (S.hl && S.hl.lifeline === l.id) cls.push('hl');
  const g = el('g', { class: cls.join(' '), 'data-life': l.id }, parent);
  const x = G.xs[l.id], w = G.ws[l.id];
  const created = G.createdAt[l.id];
  const top = created !== undefined ? sqRowY(created) - SQ.HEAD / 2 : SQ.TOP;
  const endY = G.deletedAt[l.id] !== undefined ? sqRowY(G.deletedAt[l.id]) : G.bottom;
  el('line', { class: 'sq-line', x1: x, x2: x, y1: top + SQ.HEAD, y2: endY }, g);
  el('rect', { class: 'sq-band', x: x - 34, y: top, width: 68, height: endY - top }, g);
  if (l.kind === 'actor') {
    el('circle', { class: 'sq-stick', cx: x, cy: top + 5, r: 4.5 }, g);
    el('path', { class: 'sq-stick', d: `M${x} ${top + 9.5}v9M${x - 7} ${top + 13}h14M${x} ${top + 18.5}l-6 7M${x} ${top + 18.5}l6 7` }, g);
    text(g, x, top + SQ.HEAD + 6, lifeLabel(l), { anchor: 'middle', bold: true });
    return;
  }
  el('rect', { class: 'box', x: x - w / 2, y: top, width: w, height: SQ.HEAD, rx: 1.5 }, g);
  if (l.kind === 'class') {
    text(g, x, top + 13, '«class»', { anchor: 'middle', cls: 'small' });
    text(g, x, top + 27, lifeLabel(l), { anchor: 'middle', bold: true });
  } else text(g, x, top + 21.5, lifeLabel(l), { anchor: 'middle', bold: true, cls: l.name ? null : 'ph' });
  if (G.deletedAt[l.id] !== undefined) {
    const y = endY;
    el('path', { class: 'sq-x', d: `M${x - 8} ${y - 8}l16 16M${x + 8} ${y - 8}l-16 16` }, g);
  }
}

function drawMessage(parent, d, row, k) {
  const y = sqRowY(k);
  const cls = ['edge', 'sq-msg'];
  if (S.view === 'mine' && S.sel && S.sel.kind === 'row' && S.sel.id === row.id) cls.push('sel');
  if (S.hl && S.hl.row === row.id) cls.push('hl');
  const g = el('g', { class: cls.join(' '), 'data-row': row.id }, parent);
  const known = (id) => id === '@start' || G.xs[id] !== undefined;
  if (!known(row.from) || !known(row.to)) return;
  const label = String(row.label || '').trim();
  const ownAct = G.tree.acts.find((a) => a.row === row.id);

  if (row.type === 'call' && row.from === row.to) {
    const sAct = senderAct(row.from, k);
    const sx = sAct ? barX(row.from, sAct.depth) + 5 : G.xs[row.from];
    const tx = ownAct ? barX(row.to, ownAct.depth) + 5 : G.xs[row.to];
    el('path', { class: 'stroke', d: `M${sx} ${y}H${sx + 34}V${y + 14}H${tx + 2}` }, g);
    el('polygon', { class: 'deco solid', points: pts([{ x: tx, y: y + 14 }, { x: tx + 9, y: y + 10 }, { x: tx + 9, y: y + 18 }]) }, g);
    el('rect', { class: 'hit-r', x: sx - 4, y: y - 14, width: 46 + tw(label || ' ', 12), height: 34 }, g);
    if (label) text(g, sx + 40, y + 3, label, { anchor: 'start' });
    return;
  }

  if (row.type === 'return' && row.from === row.to) {
    // return from a self-call: small loop from the inner bar back to the outer one
    const inner = G.tree.acts.find((a) => a.who === row.from && a.end === k);
    const outer = receiverAct(row.to, k);
    const sx = inner ? barX(row.from, inner.depth) + 5 : G.xs[row.from];
    const tx = outer ? barX(row.to, outer.depth) + 5 : G.xs[row.to];
    el('path', { class: 'stroke dash', d: `M${sx} ${y - 8}H${sx + 30}V${y + 6}H${tx + 2}` }, g);
    el('polyline', { class: 'deco open', points: pts([{ x: tx + 9, y: y + 1 }, { x: tx, y: y + 6 }, { x: tx + 9, y: y + 11 }]) }, g);
    el('rect', { class: 'hit-r', x: tx - 2, y: y - 16, width: 44 + tw(label || ' ', 12), height: 30 }, g);
    if (label) text(g, sx + 36, y + 3, label, { anchor: 'start' });
    return;
  }
  const fromX0 = G.xs[row.from], toX0 = G.xs[row.to];
  let sx, tx;
  if (row.type === 'return') {
    const sAct = G.tree.acts.find((a) => a.who === row.from && a.end === k);
    sx = edgeX(row.from, sAct, toX0);
    tx = edgeX(row.to, receiverAct(row.to, k), fromX0);
  } else {
    sx = edgeX(row.from, senderAct(row.from, k), toX0);
    if (row.type === 'create') { const w = G.ws[row.to] || 92; tx = toX0 >= sx ? toX0 - w / 2 : toX0 + w / 2; }
    else if (row.type === 'delete') tx = toX0;
    else tx = edgeX(row.to, ownAct, fromX0);
  }
  const dir = Math.sign(tx - sx) || 1;
  const dashed = row.type === 'return';
  const tipBack = row.type === 'return' ? 0 : 9;
  el('line', { class: 'stroke' + (dashed ? ' dash' : ''), x1: sx, y1: y, x2: tx - dir * tipBack, y2: y }, g);
  if (row.type === 'return') el('polyline', { class: 'deco open', points: pts([{ x: tx - dir * 9, y: y - 5 }, { x: tx, y }, { x: tx - dir * 9, y: y + 5 }]) }, g);
  else el('polygon', { class: 'deco solid', points: pts([{ x: tx, y }, { x: tx - dir * 10, y: y - 5 }, { x: tx - dir * 10, y: y + 5 }]) }, g);
  if (row.from === '@start') el('circle', { class: 'sq-dot', cx: SQ.START_X, cy: y, r: 4 }, g);
  el('rect', { class: 'hit-r', x: Math.min(sx, tx) - 2, y: y - 16, width: Math.abs(tx - sx) + 4, height: 24 }, g);
  const shown = label || (row.type === 'create' ? '' : row.type === 'call' ? '(method?)' : '');
  if (shown) text(g, (sx + tx) / 2, y - 6, shown, { anchor: 'middle', cls: label ? null : 'ph' });
}

function frameRows(d, f) {
  const rows = d.rows;
  const end = Number.isInteger(f.end) ? rows[f.end] : null;
  return { start: rows[f.start], end };
}
function drawFrame(parent, d, f, top) {
  const inner = d.rows.slice(f.start + 1, Math.ceil(f.end)).filter((r) => r.from || r.to);
  const ids = new Set();
  inner.forEach((r) => { [r.from, r.to].forEach((id) => { if (id && id !== '@start' && G.xs[id] !== undefined) ids.add(id); }); });
  const xsIn = [...ids].map((id) => G.xs[id]);
  const all = d.lifelines.map((l) => G.xs[l.id]);
  const pad = 62 - f.depth * 12;
  let x1 = (xsIn.length ? Math.min(...xsIn) : (all.length ? Math.min(...all) : 120)) - pad;
  let x2 = (xsIn.length ? Math.max(...xsIn) : (all.length ? Math.min(...all) + 160 : 300)) + pad + 30;
  if (x2 - x1 < 180) x2 = x1 + 180;
  const y1 = sqRowY(f.start) - 12;
  const y2 = Number.isInteger(f.end) ? sqRowY(f.end) - 4 : sqRowY(f.end) + 10;
  const { start, end } = frameRows(d, f);
  const isSel = (id) => S.view === 'mine' && S.sel && S.sel.kind === 'row' && S.sel.id === id;
  const isHl = (id) => S.hl && S.hl.row === id;
  const g = el('g', { class: 'sq-frame' + (isSel(f.row) ? ' sel' : '') + (isHl(f.row) ? ' hl' : '') }, parent);
  el('rect', { class: 'fr-box' + (Number.isInteger(f.end) ? '' : ' open'), x: x1, y: y1, width: x2 - x1, height: y2 - y1 }, g);
  const tagW = tw(f.frame, 12, true) + 18;
  const gl = el('g', { class: 'sq-frame' + (isSel(f.row) ? ' sel' : '') + (isHl(f.row) ? ' hl' : '') }, top);
  const tag = el('g', { 'data-row': f.row, class: 'fr-tag' }, gl);
  el('path', { class: 'fr-tagbg', d: `M${x1} ${y1}h${tagW}v12l-7 7H${x1}z` }, tag);
  text(tag, x1 + 7, y1 + 14, f.frame, { bold: true });
  const guard = f.guard ? (f.guard.startsWith('[') ? f.guard : `[${f.guard}]`) : '[guard?]';
  text(tag, x1 + tagW + 8, y1 + 14, guard, { cls: f.guard ? null : 'ph' });
  el('rect', { class: 'hit-r', x: x1, y: y1, width: tagW + 16 + tw(guard, 12), height: 20 }, tag);
  for (const e of f.elses) {
    const ey = sqRowY(e.at) - 6;
    const ge = el('g', { 'data-row': e.row, class: 'fr-else' + (isSel(e.row) ? ' sel' : '') + (isHl(e.row) ? ' hl' : '') }, gl);
    el('line', { class: 'fr-div', x1, x2, y1: ey, y2: ey }, ge);
    const eg = e.guard ? (e.guard.startsWith('[') ? e.guard : `[${e.guard}]`) : '[guard?]';
    text(ge, x1 + 8, ey + 16, eg, { cls: e.guard ? null : 'ph' });
    el('rect', { class: 'hit-r', x: x1, y: ey - 7, width: x2 - x1, height: 26 }, ge);
  }
  if (end) {
    const gb = el('g', { 'data-row': end.id, class: 'fr-end' + (isSel(end.id) ? ' sel' : '') }, g);
    el('rect', { class: 'hit-r', x: x1, y: y2 - 6, width: x2 - x1, height: 12 }, gb);
  }
}

// ---- sequence interaction ----
function lifeAtX(x) {
  if (x < SQ.START_X + 44) return '@start';
  let best = null, bd = Infinity;
  for (const l of curDiagram().lifelines) { const dd = Math.abs(G.xs[l.id] - x); if (dd < bd) { bd = dd; best = l.id; } }
  return bd <= 75 ? best : null;
}
let sdrag = null;
function seqPointerDown(evt) {
  const d = curDiagram();
  const p = svgPoint(evt);
  if (S.tool) {
    const t = S.tool;
    if (t.frame) {
      if (t.frame === 'else') {
        const at = insertIndex(p.y);
        const row = { id: uid('r'), type: 'else', guard: 'else' };
        d.rows.splice(at, 0, row);
        finishSeqTool(row);
        return;
      }
      if (!S.pending) { S.pending = { y: p.y }; renderStatus(); renderCanvas(); return; }
      let a = insertIndex(S.pending.y), b = insertIndex(p.y);
      if (b < a) [a, b] = [b, a];
      const start = { id: uid('r'), type: 'frame', frame: t.frame, guard: '' };
      const end = { id: uid('r'), type: 'end' };
      d.rows.splice(b, 0, end);
      d.rows.splice(a, 0, start);
      finishSeqTool(start);
      return;
    }
    const who = lifeAtX(p.x);
    if (!who) return;
    if (!S.pending) {
      if (who === '@start' && t.type !== 'call') { toast('Only an incoming call starts at the start dot.'); return; }
      S.pending = { from: who, y: p.y }; renderStatus(); renderCanvas(); return;
    }
    let to = who;
    if (to === '@start' && t.type !== 'return') { toast('Pick a lifeline as the target.'); return; }
    if (to === S.pending.from && (t.type === 'create' || t.type === 'delete')) { toast('Pick a different lifeline as the target.'); return; }
    const row = { id: uid('r'), type: t.type, from: S.pending.from, to, label: '' };
    d.rows.splice(insertIndex(S.pending.y), 0, row);
    finishSeqTool(row);
    return;
  }
  const rowEl = evt.target.closest('[data-row]');
  const lifeEl = evt.target.closest('[data-life]');
  if (rowEl) {
    const id = rowEl.dataset.row;
    sdrag = { kind: 'row', id, moved: false };
    svg.setPointerCapture(evt.pointerId);
    if (!(S.sel && S.sel.id === id)) select({ kind: 'row', id });
    return;
  }
  if (lifeEl) {
    const id = lifeEl.dataset.life;
    sdrag = { kind: 'life', id, moved: false };
    svg.setPointerCapture(evt.pointerId);
    if (!(S.sel && S.sel.id === id)) select({ kind: 'life', id });
    return;
  }
  select(null);
}
function seqPointerMove(evt) {
  if (!sdrag) return;
  const d = curDiagram();
  const p = svgPoint(evt);
  if (sdrag.kind === 'row') {
    const i = d.rows.findIndex((r) => r.id === sdrag.id);
    const j = Math.max(0, Math.min(d.rows.length - 1, Math.round((p.y - SQ.FIRST) / SQ.ROW)));
    if (i >= 0 && j !== i) { const [r] = d.rows.splice(i, 1); d.rows.splice(j, 0, r); sdrag.moved = true; renderCanvas(); }
  } else {
    const i = d.lifelines.findIndex((l) => l.id === sdrag.id);
    let j = 0;
    d.lifelines.forEach((l, idx) => { if (idx !== i && G.xs[l.id] < p.x) j++; });
    if (i >= 0 && j !== i) { const [l] = d.lifelines.splice(i, 1); d.lifelines.splice(j, 0, l); sdrag.moved = true; renderCanvas(); }
  }
}
function seqPointerUp() { if (sdrag && sdrag.moved) save(); sdrag = null; }
function finishSeqTool(row) {
  S.tool = null; S.pending = null;
  renderToolbox(); renderStatus();
  select({ kind: 'row', id: row.id });
  save();
  requestAnimationFrame(() => { const f = $('#s-label') || $('#s-guard'); if (f) f.focus(); });
}
function addLifeline(toolId) {
  if (S.view === 'model') showMine();
  const t = SEQ_LIFE_TOOLS.find((x) => x.id === toolId);
  const l = Object.assign({ id: uid('l') }, clone(t.life));
  curDiagram().lifelines.push(l);
  S.tool = null; S.pending = null;
  renderToolbox();
  select({ kind: 'life', id: l.id });
  save();
  requestAnimationFrame(() => { const f = $('#s-name'); if (f) { f.focus(); f.select(); } });
}
function matchFrame(rows, i) {
  // indexes of the frame start, its else rows and end, given any one of them
  let s = i;
  if (rows[i].type !== 'frame') {
    let depth = 0;
    for (s = i - 1; s >= 0; s--) {
      if (rows[s].type === 'end') depth++;
      else if (rows[s].type === 'frame') { if (depth === 0) break; depth--; }
    }
    if (s < 0) return { idx: [i] };
  }
  const idx = [s];
  let depth = 0;
  for (let j = s + 1; j < rows.length; j++) {
    const t = rows[j].type;
    if (t === 'frame') depth++;
    else if (t === 'end') { if (depth === 0) { idx.push(j); break; } depth--; }
    else if (t === 'else' && depth === 0) idx.push(j);
  }
  return { idx };
}
function seqDelete() {
  const d = curDiagram();
  if (S.sel.kind === 'life') {
    d.lifelines = d.lifelines.filter((l) => l.id !== S.sel.id);
    d.rows = d.rows.filter((r) => r.from !== S.sel.id && r.to !== S.sel.id);
  } else {
    const i = d.rows.findIndex((r) => r.id === S.sel.id);
    if (i < 0) return;
    if (['frame', 'end'].includes(d.rows[i].type)) {
      const kill = new Set(matchFrame(d.rows, i).idx.map((j) => d.rows[j].id));
      d.rows = d.rows.filter((r) => !kill.has(r.id));
    } else d.rows.splice(i, 1);
  }
  select(null); save();
}
function moveRow(id, delta) {
  const d = curDiagram();
  const i = d.rows.findIndex((r) => r.id === id);
  const j = i + delta;
  if (i < 0 || j < 0 || j >= d.rows.length) return;
  const [r] = d.rows.splice(i, 1); d.rows.splice(j, 0, r);
  renderCanvas(); save();
}
function moveLife(id, delta) {
  const d = curDiagram();
  const i = d.lifelines.findIndex((l) => l.id === id);
  const j = i + delta;
  if (i < 0 || j < 0 || j >= d.lifelines.length) return;
  const [l] = d.lifelines.splice(i, 1); d.lifelines.splice(j, 0, l);
  renderCanvas(); save();
}

function renderSeqInspector(box) {
  const d = curDiagram();
  if (S.sel.kind === 'life') {
    const l = d.lifelines.find((x) => x.id === S.sel.id);
    if (!l) { S.sel = null; box.innerHTML = helpHTML('sequence'); return; }
    box.innerHTML = `
      <h3>Lifeline</h3>
      <label class="field"><span>${l.kind === 'class' ? 'Class name (static calls)' : l.kind === 'actor' ? 'Actor name' : 'Name (:Class or name:Class)'}</span><input id="s-name" class="mono" value="${esc(l.name)}" autocomplete="off" spellcheck="false"></label>
      <label class="field"><span>Kind</span><select id="s-kind"><option value="object">Object  (:Class)</option><option value="class">Class  «class» (for static methods)</option><option value="actor">Actor</option></select></label>
      <div class="actions" style="margin-bottom:12px"><button class="btn small" id="s-left" type="button">← Move left</button><button class="btn small" id="s-right" type="button">Move right →</button></div>
      <p class="muted" style="font-size:13px">Drag the box sideways to reorder. A lifeline drops to the point where a Create message makes it.</p>
      <div class="actions"><button class="btn danger" id="s-del" type="button">Delete lifeline and its messages</button></div>`;
    $('#s-kind').value = l.kind;
    $('#s-name').oninput = (e) => { l.name = e.target.value; renderCanvas(); save(); };
    $('#s-kind').onchange = (e) => {
      l.kind = e.target.value;
      if (l.kind === 'class') l.name = l.name.replace(/^[^:]*:/, '');
      if (l.kind === 'object' && !l.name.includes(':')) l.name = ':' + l.name;
      renderCanvas(); renderInspector(); save();
    };
    $('#s-left').onclick = () => moveLife(l.id, -1);
    $('#s-right').onclick = () => moveLife(l.id, 1);
    $('#s-del').onclick = seqDelete;
    return;
  }
  const row = d.rows.find((r) => r.id === S.sel.id);
  if (!row) { S.sel = null; box.innerHTML = helpHTML('sequence'); return; }
  const moveBtns = `<div class="actions" style="margin-bottom:12px"><button class="btn small" id="s-up" type="button">↑ Move up</button><button class="btn small" id="s-down" type="button">↓ Move down</button></div>`;
  if (['frame', 'else', 'end'].includes(row.type)) {
    const head = row.type === 'frame' ? 'Frame' : row.type === 'else' ? 'Else divider' : 'Frame end';
    box.innerHTML = `
      <h3>${head}</h3>
      ${row.type === 'frame' ? `<label class="field"><span>Kind</span><select id="s-frame"><option value="loop">loop (for / while)</option><option value="alt">alt (if / else)</option><option value="opt">opt (if, no else)</option><option value="par">par (parallel)</option></select></label>` : ''}
      ${row.type !== 'end' ? `<label class="field"><span>Guard condition</span><input id="s-guard" class="mono" value="${esc(row.guard)}" placeholder="${row.type === 'else' ? 'else' : 'for each item'}" autocomplete="off"></label>` : '<p class="muted">Marks where the frame closes. Drag it, or use the buttons, to change what the frame wraps.</p>'}
      ${moveBtns}
      <div class="actions"><button class="btn danger" id="s-del" type="button">${row.type === 'else' ? 'Delete divider' : 'Delete frame'}</button></div>`;
    if (row.type === 'frame') { $('#s-frame').value = row.frame; $('#s-frame').onchange = (e) => { row.frame = e.target.value; renderCanvas(); save(); }; }
    if ($('#s-guard')) $('#s-guard').oninput = (e) => { row.guard = e.target.value; renderCanvas(); save(); };
  } else {
    const opts = (sel, allowStart) => (allowStart ? `<option value="@start"${sel === '@start' ? ' selected' : ''}>start (outside caller)</option>` : '') +
      d.lifelines.map((l) => `<option value="${esc(l.id)}"${l.id === sel ? ' selected' : ''}>${esc(lifeLabel(l))}</option>`).join('');
    const ph = { call: 'method(args)', return: 'value (leave blank for void)', create: 'Class(args)', delete: '' }[row.type];
    box.innerHTML = `
      <h3>Message</h3>
      <label class="field"><span>Kind</span><select id="s-type"><option value="call">Call</option><option value="return">Return</option><option value="create">Create</option><option value="delete">Delete (X)</option></select></label>
      <div class="row2">
        <label class="field"><span>From</span><select id="s-from">${opts(row.from, row.type === 'call')}</select></label>
        <label class="field"><span>To</span><select id="s-to">${opts(row.to, row.type === 'return')}</select></label>
      </div>
      ${row.type !== 'delete' ? `<label class="field"><span>Label</span><input id="s-label" class="mono" value="${esc(row.label)}" placeholder="${esc(ph)}" autocomplete="off" spellcheck="false"></label>` : ''}
      ${moveBtns}
      <div class="actions"><button class="btn danger" id="s-del" type="button">Delete message</button></div>`;
    $('#s-type').value = row.type;
    $('#s-type').onchange = (e) => { row.type = e.target.value; renderCanvas(); renderInspector(); save(); };
    $('#s-from').onchange = (e) => { row.from = e.target.value; renderCanvas(); save(); };
    $('#s-to').onchange = (e) => { row.to = e.target.value; renderCanvas(); save(); };
    if ($('#s-label')) $('#s-label').oninput = (e) => { row.label = e.target.value; renderCanvas(); save(); };
  }
  $('#s-up').onclick = () => moveRow(row.id, -1);
  $('#s-down').onclick = () => moveRow(row.id, 1);
  $('#s-del').onclick = seqDelete;
}

// ---------------- status ----------------
function renderStatus() {
  const st = $('#status');
  st.classList.toggle('model', S.view === 'model');
  if (S.view === 'model') { st.innerHTML = '<strong>Model answer.</strong> One accepted version. Other versions can also be correct. <button class="btn small" id="backMine" type="button">Back to my diagram</button>'; $('#backMine').onclick = showMine; return; }
  if (S.tool) {
    const first = !S.pending;
    const second = S.tool.frame ? 'now click where the frame ends.' : isSeq() ? 'now click the receiving lifeline.' : 'now click the second box.';
    st.innerHTML = `<strong>${esc(S.tool.label)}:</strong> ${first ? esc(S.tool.hint) : second} <span class="muted">Esc to cancel.</span>`;
    return;
  }
  const P = curPart();
  if (isAct()) { st.textContent = 'Add a start node, actions, diamonds and bars from the toolbox, then join them with Flow. Click a flow to give it a guard or route it around the side.'; return; }
  if (isSeq()) { st.textContent = 'Add lifelines, then messages top to bottom. Activation bars are drawn for you from the calls and returns. Drag a message up or down to reorder.'; return; }
  st.textContent = P.p.mode === 'object'
    ? 'Drag an Object box from the toolbox, name it name:Class, then join objects with Object link.'
    : 'Click a box to edit it on the right. Drag boxes to move them. Pick a line, then click two boxes.';
}

// ---------------- inspector ----------------
function select(sel) {
  S.sel = sel;
  if (!(S.side === 'author' && !sel)) setSide('edit');
  renderCanvas();
  renderInspector();
}
function nodeById(id) { return curDiagram().nodes.find((n) => n.id === id); }
const linesOf = (v) => v.split('\n').map((s) => s.replace(/\s+$/, '')).filter((s) => s.trim());

function renderInspector() {
  const box = $('#inspector');
  const d = curDiagram();
  const P = curPart();
  if (!S.sel || S.view === 'model') { box.innerHTML = helpHTML(P.p.mode); return; }
  if (isSeq()) { renderSeqInspector(box); return; }
  if (isAct()) { renderActInspector(box); return; }
  if (S.sel.kind === 'node') {
    const n = nodeById(S.sel.id);
    if (!n) { S.sel = null; box.innerHTML = helpHTML(P.p.mode); return; }
    const kindVal = n.kind === 'object' ? 'object' : n.stereo || 'class';
    const isEnum = kindVal === 'enumeration', isObj = kindVal === 'object';
    box.innerHTML = `
      <h3>${isObj ? 'Object' : 'Class'} box</h3>
      <label class="field"><span>${isObj ? 'Name (name:Class or :Class)' : 'Name'}</span><input id="f-name" class="mono" value="${esc(n.name)}" autocomplete="off" spellcheck="false"></label>
      <label class="field"><span>Kind</span><select id="f-kind">
        <option value="class">Class</option><option value="interface">Interface «interface»</option><option value="abstract">Abstract class {abstract}</option><option value="enumeration">Enumeration «enumeration»</option><option value="object">Object (name:Class)</option>
      </select></label>
      <label class="field"><span>${isEnum ? 'Enum values, one per line' : isObj ? 'Attribute values, one per line' : 'Attributes, one per line'}</span><textarea id="f-attrs" rows="4" spellcheck="false">${esc((n.attrs || []).join('\n'))}</textarea></label>
      ${isObj && !(n.methods || []).length ? '' : `<label class="field"><span>${isObj ? 'Methods (objects show none; delete these)' : 'Methods, one per line'}</span><textarea id="f-methods" rows="4" spellcheck="false">${esc((n.methods || []).join('\n'))}</textarea></label>`}
      ${cheatHTML(isObj ? 'object' : isEnum ? 'enum' : 'class')}
      <div class="actions"><button class="btn danger" id="f-del" type="button">Delete box</button></div>`;
    $('#f-kind').value = kindVal;
    $('#f-name').oninput = (e) => { n.name = e.target.value; renderCanvas(); save(); };
    $('#f-kind').onchange = (e) => {
      const v = e.target.value;
      if (v === 'object') { n.kind = 'object'; n.stereo = ''; if (n.name && !n.name.includes(':')) n.name = ':' + n.name; }
      else { n.kind = 'class'; n.stereo = v === 'class' ? '' : v; if (n.name.startsWith(':')) n.name = n.name.slice(1); }
      renderCanvas(); renderInspector(); save();
    };
    $('#f-attrs').oninput = (e) => { n.attrs = linesOf(e.target.value); renderCanvas(); save(); };
    const fm = $('#f-methods');
    if (fm) fm.oninput = (e) => { n.methods = linesOf(e.target.value); renderCanvas(); save(); };
    $('#f-del').onclick = deleteSel;
    return;
  }
  const e = d.edges.find((x) => x.id === S.sel.id);
  if (!e) { S.sel = null; box.innerHTML = helpHTML(P.p.mode); return; }
  const A = nodeById(e.from)?.name || '?', B = nodeById(e.to)?.name || '?';
  const assocLike = ['association', 'composition', 'aggregation', 'link'].includes(e.type);
  const endHint = { inheritance: 'child → parent', realization: 'class → interface', dependency: 'user → used', composition: 'whole ◆ part', aggregation: 'whole ◇ part' }[e.type] || '';
  box.innerHTML = `
    <h3>Line</h3>
    <label class="field"><span>Kind</span><select id="f-type">${Object.entries(TYPE_LABEL).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></label>
    <p style="margin:0 0 10px"><code>${esc(A)}</code> → <code>${esc(B)}</code> ${endHint ? `<span class="muted">(${endHint})</span>` : ''}</p>
    <div class="actions" style="margin:0 0 14px"><button class="btn small" id="f-swap" type="button">Swap ends</button></div>
    ${assocLike ? `
    <div class="fieldlabel" style="margin-bottom:6px">Arrowheads (navigability)</div>
    <label class="check"><input type="checkbox" id="f-navTo" ${e.navTo ? 'checked' : ''}> Arrow at ${esc(B)}</label>
    <label class="check" style="margin-bottom:12px"><input type="checkbox" id="f-navFrom" ${e.navFrom ? 'checked' : ''}> Arrow at ${esc(A)}</label>
    <div class="endbox"><h4>Next to ${esc(B)}</h4><div class="row2">
      <label class="field"><span>Multiplicity</span><input id="f-toMult" class="mono" value="${esc(e.toMult)}" placeholder="*, 1, 0..1" autocomplete="off"></label>
      <label class="field"><span>Role</span><input id="f-toRole" class="mono" value="${esc(e.toRole)}" placeholder="field name" autocomplete="off"></label>
    </div></div>
    <div class="endbox"><h4>Next to ${esc(A)}</h4><div class="row2">
      <label class="field"><span>Multiplicity</span><input id="f-fromMult" class="mono" value="${esc(e.fromMult)}" autocomplete="off"></label>
      <label class="field"><span>Role</span><input id="f-fromRole" class="mono" value="${esc(e.fromRole)}" autocomplete="off"></label>
    </div></div>` : ''}
    <label class="field"><span>Label (middle of the line)</span><input id="f-label" value="${esc(e.label)}" autocomplete="off"></label>
    <div class="actions"><button class="btn danger" id="f-del" type="button">Delete line</button></div>`;
  $('#f-type').value = e.type;
  $('#f-type').onchange = (ev) => { e.type = ev.target.value; renderCanvas(); renderInspector(); save(); };
  $('#f-swap').onclick = () => {
    [e.from, e.to] = [e.to, e.from];
    [e.navTo, e.navFrom] = [e.navFrom, e.navTo];
    [e.toMult, e.fromMult] = [e.fromMult, e.toMult];
    [e.toRole, e.fromRole] = [e.fromRole, e.toRole];
    renderCanvas(); renderInspector(); save();
  };
  for (const f of ['toMult', 'toRole', 'fromMult', 'fromRole', 'label']) { const i = $('#f-' + f); if (i) i.oninput = (ev) => { e[f] = ev.target.value; renderCanvas(); save(); }; }
  for (const f of ['navTo', 'navFrom']) { const i = $('#f-' + f); if (i) i.onchange = (ev) => { e[f] = ev.target.checked; renderCanvas(); save(); }; }
  $('#f-del').onclick = deleteSel;
}

function renderActInspector(box) {
  const d = curDiagram();
  const P = curPart();
  if (S.sel.kind === 'node') {
    const n = nodeById(S.sel.id);
    if (!n) { S.sel = null; box.innerHTML = helpHTML(P.p.mode); return; }
    const title = { start: 'Start node', end: 'End node', action: 'Action', decision: 'Branch / merge node', bar: 'Fork / join bar' }[n.kind] || 'Node';
    const about = {
      start: 'Where the activity begins. Draw one, with one flow out.',
      end: 'Where a path finishes. A diagram can have more than one.',
      decision: 'Several flows out, each with a guard, is a branch: one path is taken. Several flows in and one out is a merge.',
      bar: 'One flow in and several out is a fork: the steps run at the same time. Several in and one out is a join: it waits for all of them.',
    }[n.kind];
    box.innerHTML = `
      <h3>${title}</h3>
      ${n.kind === 'action' ? `<label class="field"><span>What happens</span><input id="f-name" value="${esc(n.name)}" autocomplete="off"></label>` : ''}
      ${n.kind === 'decision' ? `<label class="field"><span>Text in the diamond (optional)</span><input id="f-name" value="${esc(n.name || '')}" placeholder="usually left empty" autocomplete="off"></label>` : ''}
      ${n.kind === 'bar' ? `<label class="field"><span>Width</span><input id="f-w" type="number" min="40" step="10" value="${esc(n.w || 220)}"></label>` : ''}
      ${about ? `<p class="muted">${esc(about)}</p>` : ''}
      ${n.kind === 'action' || n.kind === 'decision' ? cheatHTML('activity') : ''}
      <div class="actions"><button class="btn danger" id="f-del" type="button">Delete</button></div>`;
    const fn = $('#f-name');
    if (fn) fn.oninput = (ev) => { n.name = ev.target.value; renderCanvas(); save(); };
    const fw = $('#f-w');
    if (fw) fw.oninput = (ev) => { const v = parseInt(ev.target.value, 10); if (v >= 40) { n.w = v; renderCanvas(); save(); } };
    $('#f-del').onclick = deleteSel;
    return;
  }
  const e = d.edges.find((x) => x.id === S.sel.id);
  if (!e) { S.sel = null; box.innerHTML = helpHTML(P.p.mode); return; }
  const nm = (id) => { const n = nodeById(id); return !n ? '?' : n.kind === 'action' ? n.name || 'action' : { start: 'start', end: 'end', decision: 'diamond', bar: 'bar' }[n.kind] || n.kind; };
  const fromBranch = nodeById(e.from)?.kind === 'decision';
  box.innerHTML = `
    <h3>Flow</h3>
    <p style="margin:0 0 10px"><code>${esc(nm(e.from))}</code> → <code>${esc(nm(e.to))}</code></p>
    <div class="actions" style="margin:0 0 14px"><button class="btn small" id="f-swap" type="button">Swap ends</button></div>
    <label class="field"><span>Guard ${fromBranch ? '' : '(only on flows out of a branch node)'}</span><input id="f-guard" class="mono" value="${esc(e.guard || '')}" placeholder="more parcels" autocomplete="off"></label>
    <p class="muted" style="margin-top:-4px">Drawn in square brackets: [more parcels].</p>
    <label class="field"><span>Path</span><select id="f-route"><option value="">Straight</option><option value="right">Around the right (loops back up)</option><option value="left">Around the left</option></select></label>
    <div class="actions"><button class="btn danger" id="f-del" type="button">Delete flow</button></div>`;
  $('#f-route').value = e.route || '';
  $('#f-guard').oninput = (ev) => { e.guard = ev.target.value; renderCanvas(); save(); };
  $('#f-route').onchange = (ev) => { if (ev.target.value) e.route = ev.target.value; else delete e.route; renderCanvas(); save(); };
  $('#f-swap').onclick = () => { [e.from, e.to] = [e.to, e.from]; renderCanvas(); renderInspector(); save(); };
  $('#f-del').onclick = deleteSel;
}

function cheatHTML(kind) {
  const rows = {
    class: [['-name: String', 'private attribute'], ['#title: String', 'protected'], ['+getCount(): int', 'method with return type'], ['+add(s: Item)', 'void return can be left out'], ['+print() {abstract}', 'abstract method'], ['-count: int {static}', 'static (shown underlined)']],
    enum: [['GOOD', 'one value per line'], ['OK', ''], ['POOR', '']],
    object: [['name = "spanner"', 'attribute with its value'], ['rating = POOR', 'enum value']],
    activity: [['Scan parcel', 'action: a short verb phrase'], ['more parcels', 'guard on a flow out of a diamond'], ['else', 'guard for the remaining path']],
    sequence: [[':Logic', 'object lifeline'], ['p:Person', 'named object'], ['find(title)', 'call label'], ['b', 'return value (optional)'], ['Loan(b, m)', 'create label']],
  }[kind];
  return `<div class="cheat" aria-label="Syntax examples">${rows.map(([a, b]) => `<div><code>${esc(a)}</code><span>${esc(b)}</span></div>`).join('')}</div>`;
}
function helpHTML(mode) {
  if (mode === 'activity') return `<div class="help">
    <h3>How to draw</h3>
    <p><strong>Nodes:</strong> click a tile or drag it onto the paper. Start, Action, Branch / merge (diamond), Fork / join (bar), End.</p>
    <p><strong>Flows:</strong> pick Flow, then click where it starts and where it goes. Click a flow to give it a guard, or route it around the side for a loop back up.</p>
    <p>Every flow out of a branch node needs a guard. Bring paths together in a merge node, or a join bar for parallel steps, before they enter an action.</p>
    <p class="muted">Delete removes the selected item. Esc cancels the flow tool. Your work is kept in this browser.</p>
    ${cheatHTML('activity')}
  </div>`;
  if (mode === 'sequence') return `<div class="help">
    <h3>How to draw</h3>
    <p><strong>Lifelines:</strong> click Object lifeline for each object. Use Class lifeline for static methods. Drag a box sideways to reorder.</p>
    <p><strong>Messages:</strong> pick Call, click the caller at the height you want, then the callee. The first call starts at the start dot on the far left. Click the same lifeline twice for a self-call.</p>
    <p><strong>Frames:</strong> pick loop, alt, opt or par, then click where it starts and where it ends. Add an Else divider inside alt.</p>
    <p class="muted">Activation bars follow from your calls and returns. Return arrows can be left out (minimal notation); the next message from a caller ends the newer activations.</p>
    ${cheatHTML('sequence')}
  </div>`;
  return `<div class="help">
    <h3>How to draw</h3>
    <p><strong>Boxes:</strong> click a tile in the toolbox, or drag it onto the paper. Edit the name and members here.</p>
    <p><strong>Lines:</strong> pick a line tile, then click two boxes. The order matters: ${mode === 'object' ? 'for links it does not.' : 'child then parent, user then used, whole then part. For a class that refers to itself, click the same box twice.'} Set arrowheads, multiplicities and roles after.</p>
    <p><strong>Grade</strong> checks your diagram against the answer key. It accepts common alternatives (for example parameter types without names) and explains each mistake.</p>
    <p class="muted">Delete removes the selected item. Esc cancels a line tool. Your work is kept in this browser.</p>
    ${cheatHTML(mode === 'object' ? 'object' : 'class')}
  </div>`;
}

// ---------------- side tabs & results ----------------
function setSide(which) {
  S.side = which;
  $('#tabEdit').setAttribute('aria-selected', which === 'edit');
  $('#tabResults').setAttribute('aria-selected', which === 'results');
  $('#tabAuthor').setAttribute('aria-selected', which === 'author');
  $('#inspector').hidden = which !== 'edit';
  $('#results').hidden = which !== 'results';
  $('#author').hidden = which !== 'author';
}
$('#tabEdit').onclick = () => setSide('edit');
$('#tabResults').onclick = () => { setSide('results'); renderResults(); };

$('#btnGrade').onclick = () => {
  if (S.view === 'model') showMine();
  const P = curPart();
  S.results[P.key] = UMLGrader.grade(P.p, S.diagrams[P.key]);
  claudeText = ''; claudeState = 'idle';
  renderTabs();
  setSide('results');
  renderResults();
};

let sampleFn = null;
let claudeText = '', claudeState = 'idle', claudeCtl = null;
if (window.claude && typeof window.claude.use === 'function') {
  window.claude.use('sample').then((s) => { sampleFn = s; if (S.side === 'results') renderResults(); }).catch(() => {});
}

function renderResults() {
  const box = $('#results');
  const P = curPart();
  const res = S.results[P.key];
  if (!res) {
    box.innerHTML = `<h3>Results</h3><p class="muted">Press <strong>Grade</strong> to check your diagram. You will get a list of mistakes, the same way the tutorial counts them.</p>
      <div class="actions"><button class="btn" id="r-model" type="button">${S.view === 'model' ? 'Back to my diagram' : 'Show model answer'}</button></div>`;
    $('#r-model').onclick = () => (S.view === 'model' ? showMine() : showModel());
    return;
  }
  const errs = res.issues.filter((i) => i.sev === 'error');
  const parts = res.issues.filter((i) => i.sev === 'partial');
  const notes = res.issues.filter((i) => i.sev === 'note');
  const cost = (i) => (i.sev === 'error' ? '−1' : i.sev === 'partial' ? '−' + i.cost : '');
  const item = (i, idx) => `<li class="issue ${i.sev}" data-i="${idx}" tabindex="0">${cost(i) ? `<span class="cost">${cost(i)}</span>` : ''}<span class="where">${esc(i.where)}</span>${esc(i.msg)}</li>`;
  const sc = res.score || { got: 0, max: 0 };
  const tally = [`${errs.length} error${errs.length === 1 ? '' : 's'}`, parts.length ? `${parts.length} partly right` : '', notes.length ? `${notes.length} note${notes.length === 1 ? '' : 's'}` : ''].filter(Boolean).join(' · ');
  box.innerHTML = `
    <div class="score ${errs.length ? 'dirty' : parts.length ? 'part' : 'clean'}"><span class="num">${sc.got}</span><span class="of">/ ${sc.max}</span><span class="muted">${tally}</span></div>
    <p class="muted" style="margin:0">${errs.length || parts.length ? 'Each mistake costs 1 mark and each partly right item ½, out of one mark per thing the answer key checks. Hover a mistake to see it on the paper. Click to select it.' : 'No mistakes found. Check the notes for accepted alternatives.'}</p>
    ${errs.length ? `<ul class="issues">${errs.map((i) => item(i, res.issues.indexOf(i))).join('')}</ul>` : ''}
    ${parts.length ? `<h3 style="margin-top:14px">Partly right</h3><ul class="issues">${parts.map((i) => item(i, res.issues.indexOf(i))).join('')}</ul>` : ''}
    ${notes.length ? `<h3 style="margin-top:14px">Notes</h3><ul class="issues">${notes.map((i) => item(i, res.issues.indexOf(i))).join('')}</ul>` : ''}
    <div class="actions" style="margin-top:12px">
      <button class="btn" id="r-model" type="button">${S.view === 'model' ? 'Back to my diagram' : 'Show model answer'}</button>
      ${sampleFn ? `<button class="btn" id="r-claude" type="button" ${claudeState === 'busy' ? 'disabled' : ''}>Ask Claude to double-check</button>` : ''}
      ${claudeState === 'busy' ? '<button class="btn small" id="r-stop" type="button">Stop</button>' : ''}
    </div>
    ${sampleFn ? `<p class="muted" style="font-size:12px;margin:8px 0 0">Claude reviews the checker's findings for answers a marker might still accept, and for mistakes it missed. Uses your Claude account.</p>` : ''}
    ${claudeText || claudeState === 'busy' ? `<div class="claude-out" id="r-out">${esc(claudeText || 'Thinking…')}</div>` : ''}`;
  box.querySelectorAll('.issue').forEach((li) => {
    const iss = res.issues[+li.dataset.i];
    const on = () => { if (iss.ref) { S.hl = iss.ref; renderCanvas(); } };
    const off = () => { S.hl = null; renderCanvas(); };
    li.addEventListener('mouseenter', on); li.addEventListener('focus', on);
    li.addEventListener('mouseleave', off); li.addEventListener('blur', off);
    li.addEventListener('click', () => {
      if (!iss.ref) return;
      if (S.view === 'model') showMine();

async function askClaude() {

      rate_limited: 'Too many requests. Try again in a minute.', session_expired: 'Sign in again to use Claude.', refused: 'Claude declined this request.',
    }[e && e.code];

async function offerDownload(filename, text) {
  if (window.claude && typeof window.claude.use === 'function') {

    if (dl) {

      catch (e) {

        await copyText(text, `Saving isn't available here, so the JSON was copied instead.`);

    }

  }
  const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));

function importQuestions(list, origin) {
  const added = [];
  const errs = [];
  for (const q of list) {
    if (!q || typeof q !== 'object' || typeof q.id !== 'string' || !/^[a-z0-9-]+$/.test(q.id) || !Array.isArray(q.parts) || !q.parts.length) { errs.push('a file is not a UML Drill question (needs an id and parts)'); continue; }
    const bad = q.parts.find((p) => !UMLAuthor.MODES.includes(p.mode));
    if (bad) { errs.push(`${q.id}: part ${bad.id} has an unknown mode`); continue; }
    q.parts.forEach((p) => {
      p.model = p.model || UMLAuthor.emptyDiagram(p.mode);
      p.key = p.key || UMLAuthor.emptyKey(p.mode);
      p.examples = p.examples || [];
    });
    q.code = Array.isArray(q.code) ? q.code : [];
    const i = S.questions.findIndex((x) => x.id === q.id);
    if (i >= 0) {
      S.questions[i] = q;
      q.parts.forEach((p) => { const k = `${q.id}/${p.id}`; delete S.diagrams[k]; delete S.results[k]; });
    } else S.questions.push(q);
    commitQ(q);
    added.push(q);
  }
  if (added.length) {
    rebuildParts(added[0].parts[0]);
    goTo(S.cur);
    if (S.author) { setSide('author'); renderAuthor(); }
  }
  if (errs.length) toast(errs[0]);
  else if (added.length) toast(`Imported ${added.length} question${added.length === 1 ? '' : 's'}${origin ? ' from ' + origin : ''}.`);
}

const getAt = (root, path) => path.reduce((o, k) => (o == null ? o : o[k]), root);
function rootObj(r) { const P = curPart(); return r === 'q' ? P.q : r === 'p' ? P.p : P.p.key; }
const bind = (root, path, f, t, extra = '') => `data-root="${root}" data-path="${esc(JSON.stringify(path))}" data-f="${esc(f)}" data-t="${t}" ${extra}`;
const listVal = (arr) => esc((arr || []).filter((v) => v !== '').join(', '));

function onBound(e) {
  const t = e.target;
  if (!t.dataset || !t.dataset.f) return;
  const isToggle = t.type === 'checkbox' || t.tagName === 'SELECT';
  if ((e.type === 'change') !== isToggle) return;
  const P = curPart();
  const obj = getAt(rootObj(t.dataset.root), JSON.parse(t.dataset.path || '[]'));
  if (!obj) return;
  const f = t.dataset.f;
  switch (t.dataset.t) {
    case 'text': if (t.dataset.opt !== undefined && !t.value.trim()) delete obj[f]; else obj[f] = t.value; break;
    case 'num': if (t.value === '') delete obj[f]; else obj[f] = Math.max(0, parseInt(t.value, 10) || 0); break;
    case 'list': {
      const hadBlank = (obj[f] || []).includes('');
      const vals = t.value.split(',').map((s) => s.trim()).filter(Boolean);
      const out = hadBlank ? [''].concat(vals) : vals;
      if (out.length) obj[f] = out; else delete obj[f];
      break;
    }
    case 'blank': {
      let arr = (obj[f] || []).filter((v) => v !== '');
      if (t.checked) arr = [''].concat(arr);
      if (arr.length) obj[f] = arr; else delete obj[f];
      break;
    }
    case 'bool': if (t.checked) obj[f] = true; else delete obj[f]; break;
    case 'negbool': if (!t.checked) obj[f] = true; else delete obj[f]; break;
    case 'member': {
      let arr = (obj[f] || []).filter((v) => v !== t.dataset.v);
      if (t.checked) arr.push(t.dataset.v);
      if (arr.length) obj[f] = arr; else delete obj[f];
      break;
    }
    case 'sel': if (t.value === '' && t.dataset.opt !== undefined) delete obj[f]; else obj[f] = t.value; break;
    case 'tags': obj[f] = t.value.split(',').map((s) => s.trim()).filter(Boolean); break;
  }
  commitQ(P.q);
  if (t.dataset.root !== 'k') { renderQuestion(); renderTabs(); }
  if (t.dataset.rerender !== undefined) renderAuthor();
}

const checkBadge = (chk) => (chk.problems.length ? `<span class="a-bad">${chk.problems.length}</span>` : '<span class="a-good">✓</span>');
function examplesHTML(q, p) {

      return `<li class="${st && !st.ok ? 'bad' : ''}">
        <div class="a-exrow"><input ${bind('p', ['examples', i], 'name', 'text')} value="${esc(ex.name)}" aria-label="Example name"><span class="a-exp">${esc(exp)}</span><span class="a-st">${st ? (st.ok ? '✓' : '✗') : ''}</span></div>
        ${st && !st.ok ? `<div class="a-err">${esc(st.msg)}</div>` : ''}

}
function checksHTML(q) {

    ${chk.problems.length ? `<ul class="a-list">${chk.problems.map((pr) => `<li class="bad"><b>${esc(pr.where)}</b><div>${esc(pr.msg)}</div>${(pr.issues || []).filter((i) => i.sev === 'error').slice(0, 6).map((i) => `<div class="a-sub">${esc(i.where)}: ${esc(i.msg)}</div>`).join('')}</li>`).join('')}</ul>` : '<p class="a-ok">All checks pass. The file will pass <code>node scripts/check.js</code>.</p>'}
    <details class="a-passed"><summary>${chk.passed.length} passing</summary><ul class="a-list">${chk.passed.map((pr) => `<li><b>${esc(pr.where)}</b> <span class="muted">${esc(pr.msg)}</span></li>`).join('')}</ul></details>`;

function runChecks(q) {
  if (!A.check || A.check.q !== q) A.check = { q, res: UMLAuthor.checkQuestion(q) };
  return A.check.res;
}
function renderCheckSummary() {
  const el = $('#aSummary');
  if (!el || !curPart()) return;
  const r = runChecks(curPart().q);
  el.className = 'a-summary ' + (r.problems.length ? 'bad' : 'ok');
  el.textContent = r.problems.length ? `${r.problems.length} check${r.problems.length === 1 ? '' : 's'} failing` : 'All checks pass';
  const P = curPart();
  const swap = (id, html) => { const c = $(id); if (c && !c.contains(document.activeElement)) c.innerHTML = html; };
  swap('#aExList', examplesHTML(P.q, P.p));
  swap('#aChecks', checksHTML(P.q));
  const bdg = $('#aCheckBadge'); if (bdg) bdg.innerHTML = checkBadge(r);
}
function exampleStatus(q, p) {
  const out = {};
  const r = runChecks(q);
  const pre = `part ${p.id} example "`;
  r.passed.forEach((x) => { if (x.where.startsWith(pre)) out[x.where.slice(pre.length, -1)] = { ok: true }; });
  r.problems.forEach((x) => { if (x.where.startsWith(pre)) out[x.where.slice(pre.length, -1)] = { ok: false, msg: x.msg, thrown: !/expected/.test(x.msg) }; });
  return out;
}

// ---- key forms ----
const ALL_TYPES = ['association', 'composition', 'aggregation', 'dependency', 'inheritance', 'realization'];
function sigText(s, ctor) {
  if (s.params) return `${s.vis || ''}${s.name}(${s.params.map((x) => (x.name ? x.name + ': ' : '') + x.type).join(', ')})${s.ret ? ': ' + s.ret : ''}${s.abstract ? ' {abstract}' : ''}${s.static ? ' {static}' : ''}`;
  return `${s.vis || ''}${s.name}${s.type ? ': ' + [].concat(s.type)[0] : ''}${s.static ? ' {static}' : ''}`;
}
function keyForm(p) {
  if (p.mode === 'object') return objectKeyForm(p.key);
  if (p.mode === 'sequence') return seqKeyForm(p.key);
  if (p.mode === 'activity') return actKeyForm(p.key);

}
function classKeyForm(k) {

    const st = c.stereo || '';

    if (st === 'enumeration') {
      members = `<label class="field"><span>Values (comma)</span><input class="mono" ${bind('k', ['classes', name], 'values', 'list')} value="${listVal(c.values)}"></label>`;
    } else {
      const row = (arr, i, s, opt, isAttr) => `
        <div class="a-mem">
          <code>${esc(sigText(s))}</code>
          <label class="check"><input type="checkbox" data-act="memopt" data-cls="${esc(name)}" data-arr="${arr}" data-i="${i}" ${opt ? '' : 'checked'}> Required</label>
          ${isAttr ? `<label class="a-inline"><span>Types</span><input class="mono" ${bind('k', ['classes', name, arr, i], 'type', 'list')} value="${listVal(s.type)}" title="Accepted types, comma separated"></label>` : ''}
        </div>`;
      members = ['attrs', 'optionalAttrs', 'methods', 'optionalMethods'].map((arr) => (c[arr] || []).map((s, i) => row(arr, i, s, arr.startsWith('optional'), arr.endsWith('ttrs'))).join('')).join('')

      <label class="field"><span>Kind</span><select ${bind('k', ['classes', name], 'stereo', 'sel', 'data-opt data-rerender')}>
        ${['', 'interface', 'abstract', 'enumeration'].map((v) => `<option value="${v}" ${v === st ? 'selected' : ''}>${v || 'class'}</option>`).join('')}</select></label>
      ${members}</details>`;
  }).join('');
  const rels = (k.relations || []).map((r, i) => {

    const others = ALL_TYPES.filter((t) => t !== r.type);
    return `<div class="a-card">
      <div class="a-cardhead"><code>${esc(r.from)} → ${esc(r.to)}</code><button class="btn small" data-act="delrel" data-i="${i}" type="button" aria-label="Delete relationship">✕</button></div>
      <div class="row2">
        <label class="field"><span>Kind</span><select ${bind('k', path, 'type', 'sel', 'data-rerender')}>${ALL_TYPES.map((t) => `<option ${t === r.type ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
        <label class="check a-req"><input type="checkbox" ${bind('k', path, 'optional', 'negbool')} ${r.optional ? '' : 'checked'}> Required</label>

      <div class="a-chips">${others.map((t) => `<label class="check"><input type="checkbox" ${bind('k', path, 'acceptTypes', 'member', `data-v="${t}" data-rerender`)} ${(r.acceptTypes || []).includes(t) ? 'checked' : ''}> ${t}</label>`).join('')}</div>
      ${(r.acceptTypes || []).length ? `<label class="field"><span>Note shown when an alternative is used</span><input ${bind('k', path, 'acceptNote', 'text', 'data-opt')} value="${esc(r.acceptNote || '')}"></label>` : ''}
      ${assoc ? `
        <label class="field"><span>Arrowheads</span><select ${bind('k', path, 'nav', 'sel', 'data-opt')}>
          <option value="">Don't check</option><option value="to" ${r.nav === 'to' ? 'selected' : ''}>At ${esc(r.to)}</option><option value="from" ${r.nav === 'from' ? 'selected' : ''}>At ${esc(r.from)}</option><option value="both" ${r.nav === 'both' ? 'selected' : ''}>Both ends</option></select></label>
        <div class="endbox"><h4>Next to ${esc(r.to)}</h4><div class="row2">
          <label class="field"><span>Multiplicity</span><input class="mono" ${bind('k', path, 'toMult', 'list')} value="${listVal(r.toMult)}" placeholder="not checked"></label>
          <label class="field"><span>Role</span><input class="mono" ${bind('k', path, 'toRole', 'list')} value="${listVal(r.toRole)}" placeholder="not checked"></label>
        </div><label class="check"><input type="checkbox" ${bind('k', path, 'toMult', 'blank')} ${(r.toMult || []).includes('') ? 'checked' : ''}> Blank multiplicity is OK</label></div>
        <div class="endbox"><h4>Next to ${esc(r.from)}</h4><div class="row2">
          <label class="field"><span>Multiplicity</span><input class="mono" ${bind('k', path, 'fromMult', 'list')} value="${listVal(r.fromMult)}" placeholder="not checked"></label>
          <label class="field"><span>Role</span><input class="mono" ${bind('k', path, 'fromRole', 'list')} value="${listVal(r.fromRole)}" placeholder="not checked"></label>

      <label class="field"><span>Hint when it's wrong</span><input ${bind('k', path, 'typeHint', 'text', 'data-opt')} value="${esc(r.typeHint || '')}" placeholder="e.g. Item implements an interface."></label>

function seqKeyForm(k) {
  const lifes = (k.lifelines || []).map((l, i) => `
    <div class="a-mem">
      <code>${esc(l.ref)}</code>
      <label class="a-inline"><span>Class</span><input class="mono" ${bind('k', ['lifelines', i], 'class', 'text')} value="${esc(l.class)}"></label>
      <label class="check"><input type="checkbox" ${bind('k', ['lifelines', i], 'static', 'bool')} ${l.static ? 'checked' : ''}> Static (class lifeline)</label>
      <label class="check"><input type="checkbox" ${bind('k', ['lifelines', i], 'created', 'bool')} ${l.created ? 'checked' : ''}> Created in this scenario</label>
    </div>`).join('');
  const refName = (ref) => { const l = (k.lifelines || []).find((x) => x.ref === ref); return l ? (l.static ? l.class : ':' + l.class) : ref; };
  const callFields = (path, e) => `
    <label class="a-inline"><span>Args</span><input type="number" min="0" class="mono a-num" ${bind('k', path, 'args', 'num')} value="${e.args ?? ''}" placeholder="any"></label>
    ${e.create ? '' : `<label class="a-inline"><span>Returns</span><input class="mono" ${bind('k', path, 'returns', 'text', 'data-opt')} value="${esc(e.returns || '')}" placeholder="nothing"></label>`}`;
  const items = (list, path, depth) => (list || []).map((e, i) => {
    const pth = path.concat(i);
    if (e.frame) {
      const others = ['loop', 'alt', 'opt', 'par'].filter((f) => f !== e.frame);
      return `<div class="a-node" style="--d:${depth}">
        <div class="a-mem"><b class="mono">${esc(e.frame)}</b>
          <select ${bind('k', pth, 'frame', 'sel', 'data-rerender')} aria-label="Frame type">${['loop', 'alt', 'opt', 'par'].map((f) => `<option ${f === e.frame ? 'selected' : ''}>${f}</option>`).join('')}</select>
          <span class="muted">also accept</span>${others.map((f) => `<label class="check"><input type="checkbox" ${bind('k', pth, 'accept', 'member', `data-v="${f}"`)} ${(e.accept || []).includes(f) ? 'checked' : ''}> ${f}</label>`).join('')}
        </div>

          <label class="a-inline"><span>Guard ${(e.branches || []).length > 1 ? bi + 1 : ''}</span><input class="mono" ${bind('k', pth.concat('branches', bi), 'guardExample', 'text', 'data-opt')} value="${esc(b.guardExample || '')}"></label>

function actKeyForm(k) {

}

// ---- actions ----
$('#author').addEventListener('toggle', (e) => {
  const d = e.target.closest && e.target.closest('details[data-sec]');
  if (d && e.target === d) { if (d.open) A.open.add(d.dataset.sec); else A.open.delete(d.dataset.sec); }
}, true);
$('#author').addEventListener('change', (e) => {
  const t = e.target;
  const P = curPart();
  if (!P) return;
  if (t.id === 'aId') {
    const v = t.value.trim();
    if (!/^[a-z0-9-]+$/.test(v)) { toast('Use lowercase letters, digits and dashes.'); t.value = P.q.id; return; }
    if (S.questions.some((q) => q !== P.q && q.id === v)) { toast(`A question with id ${v} already exists.`); t.value = P.q.id; return; }
    renameQuestion(P.q, v);
    return;
  }
  if (t.id === 'aMode') {
    if (t.value === P.p.mode) return;
    const mode = t.value;
    const fresh = UMLAuthor.blankPart(P.p.id, mode);
    Object.assign(P.p, { mode, starter: fresh.starter, model: fresh.model, key: fresh.key, examples: [] });
    const oldDefault = UMLAuthor.blankPart('x', UMLAuthor.MODES.find((m) => UMLAuthor.blankPart('x', m).prompt === P.p.prompt) || 'none');
    if (!P.p.prompt.trim() || (oldDefault && oldDefault.prompt === P.p.prompt)) P.p.prompt = fresh.prompt;
    S.diagrams[P.key] = emptyFor(P.p); store.set(P.key, S.diagrams[P.key]); delete S.results[P.key];
    commitQ(P.q); S.sel = null; S.tool = null; S.pending = null;
    renderToolbox(); renderAll(); renderAuthor();
    toast(`Part (${P.p.id}) is now a ${mode} diagram.`);
    return;
  }
  if (t.dataset.act === 'memopt') {
    const c = P.p.key.classes[t.dataset.cls];
    const from = t.dataset.arr;
    const to = from.startsWith('optional') ? from.charAt(8).toLowerCase() + from.slice(9) : 'optional' + from[0].toUpperCase() + from.slice(1);
    const [s] = c[from].splice(+t.dataset.i, 1);
    (c[to] = c[to] || []).push(s);
    if (!c[from].length) delete c[from];
    commitQ(P.q); renderAuthor();
    return;
  }
  if (t.dataset.act === 'orattr') {
    const r = P.p.key.relations[+t.dataset.i];
    if (t.checked) {
      const role = (r.toRole || []).find(Boolean) || r.to.charAt(0).toLowerCase() + r.to.slice(1);
      r.orAttribute = { name: role, vis: '-', type: [r.toMult && r.toMult.some((m) => m === '*' || /\.\.\*/.test(m)) ? `List<${r.to}>` : r.to] };
    } else delete r.orAttribute;
    commitQ(P.q); renderAuthor();
  }
});
function renameQuestion(q, id) {
  const old = q.id;
  q.parts.forEach((p) => {
    const ok = `${old}/${p.id}`, nk = `${id}/${p.id}`;
    S.diagrams[nk] = S.diagrams[ok]; store.set(nk, S.diagrams[nk]); delete S.diagrams[ok];
    if (S.results[ok]) { S.results[nk] = S.results[ok]; delete S.results[ok]; }
  });
  delete A.local[old];
  A.order = A.order.map((x) => (x === old ? id : x));
  q.id = id;
  A.local[id] = q;
  persistLocal();
  rebuildParts();
  renderTabs(); renderAuthor();
  toast(`Renamed to ${id}.`);
}

$('#author').addEventListener('click', async (e) => {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const P = curPart();
  const q = P.q, p = P.p;
  const i = +b.dataset.i;
  const canvas = () => clone(S.diagrams[P.key]);
  switch (b.dataset.act) {
    case 'download': await offerDownload(`${q.id}.json`, qJSON(q)); return;
    case 'copyq': await copyText(qJSON(q), `Copied ${q.id}.json.`); return;
    case 'import': $('#aFile').click(); return;
    case 'new': newQuestion(); return;
    case 'discard': {
      if (!armed('discard', b, 'Click again to discard')) return;
      const orig = clone(A.builtin[q.id]);
      delete A.local[q.id]; A.order = A.order.filter((x) => x !== q.id); persistLocal();
      const qi = S.questions.indexOf(q);
      S.questions[qi] = orig;
      orig.parts.forEach((pp) => { const k = `${orig.id}/${pp.id}`; if (!S.diagrams[k]) S.diagrams[k] = emptyFor(pp); });
      rebuildParts(orig.parts.find((pp) => pp.id === p.id) || orig.parts[0]);
      A.check = null; goTo(S.cur); renderAuthor(); toast('Restored the repo version.');
      return;
    }
    case 'delq': {
      if (!armed('delq', b, 'Click again to delete')) return;
      delete A.local[q.id]; A.order = A.order.filter((x) => x !== q.id); persistLocal();
      S.questions = S.questions.filter((x) => x !== q);
      rebuildParts(S.questions[0] && S.questions[0].parts[0]);
      A.check = null; goTo(S.cur); renderAuthor(); toast('Question deleted.');
      return;
    }
    case 'addcode': q.code.push({ file: `File${q.code.length + 1}.java`, text: '' }); break;
    case 'delcode': q.code.splice(i, 1); break;
    case 'addpart': {
      const used = new Set(q.parts.map((x) => x.id));
      let id = 'a'; while (used.has(id)) id = String.fromCharCode(id.charCodeAt(0) + 1);
      const np = UMLAuthor.blankPart(id, $('#aNewMode').value);
      q.parts.push(np);
      commitQ(q); rebuildParts(np); goTo(S.cur); setSide('author'); renderAuthor();
      return;
    }
    case 'delpart': {
      if (!armed('delpart', b, 'Click again to delete')) return;
      q.parts = q.parts.filter((x) => x !== p);
      commitQ(q); rebuildParts(q.parts[0]); goTo(S.cur); setSide('author'); renderAuthor();
      return;
    }
    case 'setmodel':
      if (S.view === 'model') { toast('Switch back to your diagram first.'); return; }
      if (isEmptyDiagram(S.diagrams[P.key])) { toast('The canvas is empty. Draw the model answer first.'); return; }
      p.model = canvas();
      toast(isEmptyKey(p) ? 'Model saved. Now generate the key.' : 'Model saved. Generate the key again if the drawing changed.');
      break;
    case 'editmodel':
    case 'editstarter': {
      const src = b.dataset.act === 'editmodel' ? p.model : p.starter;
      if (!isEmptyDiagram(S.diagrams[P.key]) && !armed(b.dataset.act, b, 'Replace the canvas? Click again')) return;
      S.diagrams[P.key] = clone(src || UMLAuthor.emptyDiagram(p.mode)); store.set(P.key, S.diagrams[P.key]);
      S.view = 'mine'; S.sel = null; delete S.results[P.key];
      renderTabs(); renderAll(); renderAuthor();
      return;
    }
    case 'setstarter':
      if (S.view === 'model') { toast('Switch back to your diagram first.'); return; }
      p.starter = canvas(); toast('Starter saved.');
      break;
    case 'clearstarter': p.starter = UMLAuthor.emptyDiagram(p.mode); break;
    case 'genkey':
      if (isEmptyDiagram(p.model)) { toast('Save a model answer first.'); return; }
      if (!isEmptyKey(p) && !armed('genkey', b, 'Replace the current key? Click again')) return;
      p.key = UMLAuthor.generateKey(p.mode, p.model);
      A.jsonOpen = false;
      toast('Draft key generated from the model answer.');
      break;
    case 'jsonkey': A.jsonOpen = !A.jsonOpen; A.jsonErr = ''; renderAuthor(); return;
    case 'applyjson':
      try { p.key = JSON.parse($('#aKeyJson').value); A.jsonErr = ''; toast('Key updated.'); }
      catch (err) { A.jsonErr = 'Not valid JSON: ' + err.message; renderAuthor(); return; }
      break;
    case 'delrel': p.key.relations.splice(i, 1); break;
    case 'delobj': {
      const ref = p.key.objects[i].ref;
      p.key.objects.splice(i, 1);
      p.key.links = (p.key.links || []).filter((l) => l.a !== ref && l.b !== ref);
      break;
    }
    case 'dellink': p.key.links.splice(i, 1); break;
    case 'addex': {
      if (S.view === 'model') { toast('Switch back to your diagram first.'); return; }
      if (isEmptyDiagram(p.model)) { toast('Save a model answer first. Examples are stored as changes to it.'); return; }
      const d = canvas();
      const name = ($('#aExName').value || '').trim() || `Mistake ${(p.examples || []).length + 1}`;
      if ((p.examples || []).some((x) => x.name === name)) { toast('Use a different name; examples need unique names.'); return; }
      const r = UMLGrader.grade(p, d);
      const patch = UMLAuthor.diffPatch(p.model, d);
      const ex = { name, expect: expectOf(r) };
      if (patch.diagram) ex.diagram = patch.diagram; else ex.patch = patch;
      (p.examples = p.examples || []).push(ex);
      toast(r.errors || r.partials ? `Saved with ${r.errors} error${r.errors === 1 ? '' : 's'}${r.partials ? `, ${r.partials} partly right` : ''} and ${r.notes} note${r.notes === 1 ? '' : 's'}.` : 'Saved. Note: this example has no errors, so it records an accepted answer.');
      break;
    }
    case 'loadex': {
      const ex = p.examples[i];
      let d;
      try { d = UMLAuthor.exampleDiagram(p, ex); } catch (err) { toast(err.message); return; }
      if (!isEmptyDiagram(S.diagrams[P.key]) && !armed('loadex' + i, b, 'Replace the canvas? Click again')) return;
      S.diagrams[P.key] = d; store.set(P.key, d); S.view = 'mine'; S.sel = null;
      S.results[P.key] = UMLGrader.grade(p, d);
      renderTabs(); renderAll(); renderAuthor();
      return;
    }
    case 'acceptex': {
      const ex = p.examples[i];
      const r = UMLGrader.grade(p, UMLAuthor.exampleDiagram(p, ex));
      ex.expect = expectOf(r);
      break;
    }
    case 'delex': p.examples.splice(i, 1); break;
    default: return;
  }
  commitQ(q);
  renderQuestion(); renderTabs(); renderAuthor();
});
function isEmptyKey(p) {
  const k = p.key || {};
  if (p.mode === 'sequence') return !(k.lifelines || []).length;
  if (p.mode === 'activity') return !(k.actions || []).length;
  if (p.mode === 'object') return !(k.objects || []).length;
  return !Object.keys(k.classes || {}).length;
}

// ---------------- boot ----------------
async function boot() {
  try {
    const idx = await (await fetch('questions/index.json')).json();
    for (const f of idx.questions) S.questions.push(await (await fetch('questions/' + f)).json());
    S.questions.forEach((q) => { A.builtin[q.id] = clone(q); });
  } catch (e) {
    $('#layout').innerHTML = `<div class="loaderr"><h3>Could not load the questions</h3><p>The page reads <code>questions/*.json</code>. If you opened <code>index.html</code> straight from disk, serve the folder instead, for example <code>npx serve .</code> or <code>python3 -m http.server</code>, then open the address it prints.</p><p class="muted">${esc(e.message)}</p></div>`;
    return;
  }
  loadLocal();
  S.questions = S.questions.map((q) => A.local[q.id] || q);
  A.order.forEach((id) => { if (!A.builtin[id] && A.local[id]) S.questions.push(A.local[id]); });
  rebuildParts();
  let start = 0;
  try { start = Math.min(S.parts.length - 1, Math.max(0, parseInt(localStorage.getItem('umldrill.v1.cur') || '0', 10) || 0)); } catch {}
  S.cur = start;
  renderTabs(); renderToolbox(); renderAll();
  let auth = false;
  try { auth = localStorage.getItem('umldrill.v1.author') === '1'; } catch {}
  if (auth) setAuthor(true);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => renderCanvas());
}
boot();
})();
</script>
